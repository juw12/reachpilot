<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReachPilot</title>
<meta name="theme-color" content="#0a66c2">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Design tokens: see design.md (editorial ledger: warm paper, serif headings, one blue accent) */
  :root {
    --bg: #faf9f6; --card: #faf9f6; --ink: #1f1d1a; --muted: #5f5a52; --line: #e4e0d8;
    --blue: #0a5aa8; --blue-soft: #eaf1f8; --green: #057642; --green-soft: #e6f4ea;
    --amber: #915907; --amber-soft: #fdf3e1; --red: #b42318; --red-soft: #fdecea;
    --serif: Georgia, Cambria, "Times New Roman", ui-serif, serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 var(--sans); background: var(--bg); color: var(--ink); }
  header.top { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
  .brand { margin: 0; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo { width: 28px; height: 28px; display: block; }
  nav { display: flex; gap: 2px; min-width: 0; }
  nav button { border: 0; background: none; padding: 8px 12px; border-radius: 6px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
  nav button:hover { background: #f1f3f4; color: var(--ink); }
  nav button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  nav button[aria-selected="true"] { color: var(--blue); background: var(--blue-soft); font-weight: 600; }
  .updated { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  @media (max-width: 760px) {
    .bar { flex-wrap: wrap; gap: 4px 12px; padding: 8px 14px 0; }
    .brand { font-size: 15px; }
    .navrow { order: 3; flex: 1 0 100%; display: flex; gap: 4px; align-items: flex-start; padding: 0 0 6px; }
    nav { flex: 0 1 auto; flex-wrap: wrap; gap: 4px; }
    nav::-webkit-scrollbar { display: none; }
    
    nav button { min-height: 44px; padding: 8px 10px; background: #f1f3f5; border-radius: 8px; }
    nav button[aria-selected="true"] { background: var(--blue-soft); }
    nav:not(.open) button.sec:not([aria-selected="true"]) { display: none; }
    .more { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 8px;
      background: #f1f3f5; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .more:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
    .module h3 .btn { min-height: 44px; }
    .help-btn { width: 44px; height: 44px; }
    .btn { min-height: 44px; padding: 10px 16px; }
    main { padding: 14px; }
    td a, .todo li a, .launch-links a, details summary { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; }
  }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  @media (min-width: 761px) { .navrow { display: contents; } .more { display: none; } }
  section[hidden] { display: none; }
  nav button[hidden] { display: none !important; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 18px; }
  .card { background: var(--card); border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .kpi .value.long { font-size: 19px; line-height: 1.3; margin-top: 6px; }
  .kpi .note { color: var(--muted); font-size: 12px; }
  .wide { grid-column: 1 / -1; }
  .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); margin-bottom: 18px; }
  .next { border-left: 5px solid var(--blue); }
  .next .when { font-weight: 600; color: var(--blue); }
  .next .title { font-size: 20px; font-weight: 700; margin: 2px 0; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--blue-soft); color: var(--blue); }
  .badge.good { background: var(--green-soft); color: var(--green); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .badge.bad { background: var(--red-soft); color: var(--red); }
  .badge.grey { background: #eef0f2; color: var(--muted); }
  .note-badge { display: block; width: fit-content; max-width: 100%; white-space: normal; margin-top: 4px; line-height: 1.45; padding: 3px 9px; border-radius: 8px; }
  .post { background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); border-left: 5px solid var(--blue); }
  .post.auto, .post.cap { border-left-color: #a9b3ba; background: #fafafa; }
  .post.event { border-left-color: var(--green); }
  .post .head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .post .when { font-weight: 600; }
  .post .num { display: inline-block; min-width: 26px; text-align: center; background: var(--ink); color: #fff; border-radius: 4px; margin-right: 8px; font-size: 12px; }
  .post h4 { margin: 6px 0 0; font-size: 16px; }
  .post .hook { color: #38434f; margin: 2px 0 8px; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; align-items: flex-start; }
  .thumbs video.reel { width: 152px; height: 190px; }
  .thumbs img, .thumbs video { flex: none; width: 170px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: #eef0f2; }
  details summary { cursor: pointer; color: var(--blue); font-weight: 600; margin-top: 8px; }
  pre.text { white-space: pre-wrap; font: inherit; background: #f8f9fa; padding: 12px; border-radius: 6px; margin: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  .scroll { overflow-x: auto;
    background:
      linear-gradient(to right, var(--card) 30%, rgba(255,255,255,0)) left / 32px 100% no-repeat local,
      linear-gradient(to left, var(--card) 30%, rgba(255,255,255,0)) right / 32px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.16), transparent) left / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.16), transparent) right / 12px 100% no-repeat scroll; }
  .scroll:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .scroll table { min-width: 720px; }
  .scroll td:first-child { white-space: nowrap; }
  .scroll td b { white-space: nowrap; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.quiet td { color: var(--muted); }
  tr.quiet td a { color: var(--muted); }
  .empty { color: var(--muted); padding: 18px; text-align: center; background: #fafafa; border-radius: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  .hint code { background: #eef0f2; padding: 1px 5px; border-radius: 4px; }
  svg.chart { width: 100%; height: auto; }
  svg.chart .axis { stroke: var(--line); }
  svg.chart .line { fill: none; stroke: var(--blue); stroke-width: 2.5; }
  svg.chart .dot { fill: var(--blue); }
  svg.chart text { fill: var(--muted); font-size: 12px; }
  .rank { display: grid; grid-template-columns: 150px 1fr 60px; gap: 8px; align-items: center; padding: 4px 0; }
  .rank .track { background: #eef0f2; border-radius: 4px; height: 12px; overflow: hidden; }
  .rank .fill { background: var(--blue); height: 100%; }
  .log { font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; margin: 0; max-height: 70vh; overflow: auto; }
  .log .t { color: var(--muted); }
  .log .w { color: var(--amber); }
  .log .e { color: var(--red); }
  a { color: var(--blue); }

  .btn { border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--blue-soft); color: var(--blue); }
  .btn:focus-visible, .help-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .help-btn { border: 1px solid var(--line); background: var(--card); width: 32px; height: 32px; border-radius: 50%; font: 700 15px "Segoe UI", sans-serif; color: var(--blue); cursor: pointer; flex: none; }
  .tab-count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: 12px; line-height: 18px; text-align: center; font-weight: 700; }
  .todo { background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); border-left: 5px solid var(--amber); }
  .todo.p1 { border-left-color: var(--red); }
  .todo.p3, .todo.p4 { border-left-color: #a9b3ba; }
  .todo h4 { margin: 2px 0 2px; font-size: 15px; }
  .todo ul { margin: 8px 0 0; padding-left: 18px; }
  .todo li { margin: 2px 0; }
  .todo.compact { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 8px; }
  .todo .text { overflow-wrap: anywhere; }
  .todo.compact .text { min-width: 0; }
  .todo.compact h4 { display: inline; margin: 0 0 0 6px; }
  .todo.compact ul { margin: 4px 0 0; }
  .todo.compact .actions { margin-top: 0; flex: none; }
  @media (max-width: 760px) { .todo.compact { display: block; } .todo.compact .actions { margin-top: 8px; } }
  .module { border-top: 4px solid var(--blue); }
  .runs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
  .runs li { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 8px; padding: 8px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); font-size: 13px; }
  .runs .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex: none; }
  .runs li.bad .dot { background: var(--red); }
  .runs b { font-weight: 600; }
  @media (max-width: 760px) { .runs li { flex: 1 1 100%; } }
  .module .big { font-size: 24px; font-weight: 700; }
  .launch-links { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 4px; }
  .launch-links + .hint, td .badge + .hint { white-space: nowrap; }
  .module h3 { display: flex; justify-content: space-between; align-items: center; }
  .module h3 .btn { min-height: 38px; padding: 8px 18px; }
  td.zero b { color: var(--muted); font-weight: 600; }
  .toast { position: fixed; right: 18px; bottom: 18px; z-index: 5; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 380px; }
  .toast[hidden] { display: none; }
  dialog.help { border: 0; border-radius: 12px; padding: 0; max-width: 720px; width: calc(100% - 32px); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog.help::backdrop { background: rgba(0,0,0,.35); }
  dialog.help .inner { padding: 20px 22px; max-height: 80vh; overflow: auto; }
  dialog.help .mod { border-top: 1px solid var(--line); padding: 12px 0; }
  dialog.help dt { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; margin-top: 6px; }
  dialog.help dd { margin: 0; }
  .spark rect.on { fill: var(--blue); }
  .spark rect.off { fill: currentColor; opacity: .15; }
  table.daily td.n, table.daily th.n { text-align: right; white-space: nowrap; }
  table.daily tr.group-start td { border-top: 1px solid rgba(127,127,127,.25); }
  table.daily td { vertical-align: middle; }
  table.daily .repeat, table.daily .ph { display: none; }
  @media (max-width: 600px) {
    table.daily thead { display: none; }
    .scroll table.daily { min-width: 0; }
    table.daily, table.daily tbody, table.daily tr { display: block; width: 100%; }
    table.daily tr { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; padding: 12px 0;
      border-top: 1px solid var(--line); }
    table.daily tr:first-child { border-top: 0; }
    table.daily tr.group-start td { border-top: 0; }
    table.daily td { display: block; padding: 0; border: 0; text-align: left; }
    table.daily td.mod, table.daily td.what, table.daily td.sp { grid-column: 1 / -1; }
    table.daily tr:not(.group-start) { border-top: 0; padding-top: 4px; }
    table.daily td.what { color: var(--muted); margin-bottom: 4px; }
    table.daily td[data-label]::before { content: attr(data-label) " "; color: var(--muted); font-weight: 400; }
    table.daily td.n, table.daily td.hint { white-space: normal; text-align: left; }
    table.daily td.sp { margin-top: 6px; }
    table.daily .dk { display: none; }
    table.daily .ph { display: inline; }
    table.daily td.what { color: var(--ink); font-weight: 600; }
  }
  table.daily a.goto { cursor: pointer; color: var(--ink); }

  /* Editorial layer (design.md): rules instead of boxes, serif display type */
  h1, h2, h3, h4, .kpi .value, .module .big, .next .title { font-family: var(--serif); font-weight: 700; letter-spacing: -.005em; }
  header.top { background: var(--bg); border-bottom: 2px solid var(--ink); }
  .brand { font-size: 19px; }
  @media (min-width: 761px) {
    nav button { border-radius: 0; padding: 8px 8px; }
    nav button:hover { background: none; text-decoration: underline; text-underline-offset: 6px; }
    nav button[aria-selected="true"] { background: none; color: var(--ink); text-decoration: underline 2px var(--blue); text-underline-offset: 8px; }
  }
  @media (max-width: 760px) {
    nav button, .more { font-size: 14px; padding: 8px 9px; }
    .bar { gap: 4px 10px; }
  }
  .card, .post, .todo, .runs li { box-shadow: none; border-radius: 0; background: transparent; }
  .card { border-top: 1px solid var(--ink); padding: 14px 4px 10px; }
  .grid { gap: 24px; }
  .kpi .value { font-size: 34px; font-weight: 400; }
  .kpi .label { letter-spacing: .07em; font-size: 12px; color: var(--muted); }
  h2 { font-size: 26px; font-weight: 400; margin-bottom: 16px; }
  .module { border-top: 1px solid var(--ink); }
  .next { border-left: 0; border-top: 3px solid var(--blue); }
  .post, .todo { border: 0; border-top: 1px solid var(--line); padding-left: 4px; }
  .todo.p1 { border-top: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--red); padding-left: 14px; }
  .runs li { border: 1px solid var(--line); }
  .btn { border-radius: 2px; }
  .badge { border-radius: 2px; }
  .empty { background: transparent; border: 1px dashed var(--line); }
  h2, h3, h4, .next .title, .module .big { text-wrap: balance; }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand"><img class="logo" src="/icon.svg" alt="" width="28" height="28">ReachPilot</h1>
    <div class="navrow">
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="todo">To do<span class="tab-count" id="todo-count" hidden></span></button>
      <button role="tab" data-tab="linkedin">LinkedIn</button>
      <button role="tab" class="sec" data-tab="schedule">Schedule</button>
      <button role="tab" class="sec" data-tab="reach">Reach</button>
      <button role="tab" class="sec" data-tab="github">GitHub</button>
      <button role="tab" class="sec" data-tab="learning">Learning</button>
      <button role="tab" data-tab="jobs">Jobs</button>
      <button role="tab" class="sec" data-tab="email">Email</button>
      <button role="tab" class="sec" data-tab="promote">Promote</button>
      <button role="tab" class="sec" data-tab="podcast" hidden>Podcast</button>
      <button role="tab" class="sec" data-tab="log">Log</button>
    </nav>
    <button type="button" class="more" id="nav-more" aria-expanded="false" aria-controls="tabs">More ▾</button>
    </div>
    <span class="updated" id="updated">Loading…</span>
    <button class="help-btn" id="help-open" aria-label="Help: what ReachPilot does and what it needs from you" title="Help">?</button>
  </div>
</header>

<main>
  <section id="overview"></section>
  <section id="todo" hidden></section>
  <section id="linkedin" hidden></section>
  <section id="schedule" hidden></section>
  <section id="reach" hidden></section>
  <section id="github" hidden></section>
  <section id="learning" hidden></section>
  <section id="jobs" hidden></section>
  <section id="email" hidden></section>
  <section id="promote" hidden></section>
<section id="podcast" hidden></section>
  <section id="log" hidden></section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<dialog class="help" id="help"><div class="inner" id="help-body"></div></dialog>

<script>
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Escapes text, then turns every http(s) URL in it into its own link (details can hold several, comma-separated).
const linkify = (value) => esc(value).replace(/https?:\/\/[^\s,<]+?(?=&quot;|&#39;|[\s,<]|$)/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const num = (value) => (value === null || value === undefined ? "–" : Number(value).toLocaleString("en-US"));
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function niceDate(stamp) {
  if (!stamp) return "–";
  const [date, time] = stamp.split(" ");
  const [y, m, d] = date.split("-").map(Number);
  const day = new Date(y, m - 1, d);
  return `${DAYS[day.getDay()]} ${d} ${MONTHS[m - 1]}` + (time ? ` · ${time}` : "");
}

const KIND = {
  prepared: ["Prepared post", ""],
  event: ["New on GitHub", "good"],
  drafted: ["Drafted", "warn"],
  auto: ["Picked on the day", "grey"],
  cap: ["Weekly limit", "grey"],
};
const STATUS = { posted: "good", ready: "warn", awaiting_approval: "warn", failed: "bad", skipped: "grey" };

function lineChart(series, emptyText) {
  if (!series.length) return `<div class="empty">${esc(emptyText)}</div>`;
  const W = 520, H = 170, L = 36, R = 14, T = 14, B = 26;
  const max = Math.max(1, ...series.map((p) => p.y));
  const x = (i) => L + (series.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (series.length - 1));
  const y = (v) => H - B - (v * (H - T - B)) / max;
  const points = series.map((p, i) => `${x(i)},${y(p.y)}`).join(" ");
  const dots = series.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="3.5"><title>${esc(p.x)}: ${num(p.y)}</title></circle>`).join("");
  const first = series[0].x, last = series[series.length - 1].x;
  const summary = `Line chart from ${niceDate(first)} to ${niceDate(last)}, highest value ${num(max)}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}">
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    <line class="axis" x1="${L}" y1="${T}" x2="${W - R}" y2="${T}" stroke-dasharray="3 4"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${num(max)}</text>
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">0</text>
    ${series.length > 1 ? `<polyline class="line" points="${points}"/>` : ""}${dots}
    <text x="${L}" y="${H - 6}">${esc(niceDate(first))}</text>
    ${series.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(niceDate(last))}</text>` : ""}
  </svg>`;
}

function spark(series) {
  if (!series || !series.length) return "";
  const W = 120, H = 28, max = Math.max(1, ...series.map((p) => p.y));
  const step = W / series.length;
  const bars = series.map((p, i) => {
    const h = p.y ? Math.max(2, (p.y * (H - 2)) / max) : 1;
    return `<rect x="${(i * step + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(step - 2).toFixed(1)}" height="${h.toFixed(1)}" class="${p.y ? "on" : "off"}"><title>${esc(p.x)}: ${num(p.y)}</title></rect>`;
  }).join("");
  const label = `Last ${series.length} days: ${series.map((p) => num(p.y)).join(", ")}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">${bars}</svg>`;
}

function dailyTable(rows) {
  if (!rows || !rows.length) return `<div class="empty">No numbers yet. Each automation adds a row after its first run.</div>`;
  let lastModule = "";
  const body = rows.map((r) => {
    const first = r.module !== lastModule;
    lastModule = r.module;
    const avgNote = r.avg_days && r.avg_days < 7 ? ` <span class="hint">(${r.avg_days} d)</span>` : "";
    const atLimit = r.limit && r.today >= r.limit ? ` <span class="badge warn">at limit</span>` : "";
    const limitText = r.limit_label || "";
    const phoneLimit = /^\d/.test(limitText) ? `Limit ${limitText}` : limitText.charAt(0).toUpperCase() + limitText.slice(1);
    return `<tr${first ? ' class="group-start"' : ""}>
      <td class="mod">${first ? `<a class="goto" data-goto="${esc(r.tab)}"><b>${esc(r.module)}</b></a>` : `<span class="repeat">${esc(r.module)}</span>`}</td>
      <td class="what" title="${esc(r.note || "")}">${esc(r.label)}</td>
      <td class="n${r.today ? "" : " zero"}" data-label="Today"><b>${num(r.today)}</b>${atLimit}</td>
      <td class="n" data-label="Avg / day">${num(r.avg7)}${avgNote}</td>
      <td class="n" data-label="Best day">${num(r.best)}</td>

  }).join("");
  return `<div class="scroll"><table class="daily">
    <thead><tr><th>Automation</th><th>Per day</th><th class="n">Today</th><th class="n">Avg / day</th><th class="n">Best day</th><th>Daily limit</th><th>Last 14 days</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

function kpi(label, value, note = "") {

}

const TOKEN = "__RP_TOKEN__";
let latest = null;

function toast(message) {
  const box = document.getElementById("toast");
  box.textContent = message;
  box.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (box.hidden = true), 4500);
}

async function act(name, button) {
  const label = button ? button.textContent : "";
  if (button) {
    button.disabled = true;
    button.textContent = "Working…";
  }
  try {
    const response = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-ReachPilot-Token": TOKEN },
      body: JSON.stringify({ name }),
    });
    const reply = await response.json().catch(() => ({ message: "Done." }));
    toast(reply.message || (response.ok ? "Done." : "That didn't work."));
    setTimeout(load, 1500);
  } catch (error) {
    toast("Couldn't reach ReachPilot: " + error.message);
  } finally {
    if (button) {
      setTimeout(() => {
        button.disabled = false;
        button.textContent = label;
      }, 1500);
    }
  }
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (button) act(button.dataset.action, button);
  const jump = event.target.closest("[data-goto]");
  if (jump) showTab(jump.dataset.goto);
  const copy = event.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy)
      .then(() => toast("Feed address copied. Paste it on the directory's page."))
      .catch(() => toast("Copy didn't work here; select the address and copy it by hand."));
  }
  const done = event.target.closest("[data-done]");
  if (done) {
    const keys = dismissed();
    keys.push(done.dataset.done);
    try {
      localStorage.setItem("rp-done", JSON.stringify(keys.slice(-50)));
    } catch (error) {}
    toast("Marked done. It comes back if anything about it changes.");
    if (latest) {
      renderOverview(latest);
      renderTodo(latest);
    }
  }
});

function actionButton(name, label, ghost = false) {
  return name ? `<button class="btn ${ghost ? "ghost" : ""}" data-action="${esc(name)}">${esc(label)}</button>` : "";
}

function link(url, label) {
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
}

const MODULE_TAB = { jobs: "jobs", "job search": "jobs", "e-mail": "email", email: "email", linkedin: "linkedin", promote: "promote", "creator outreach": "promote", podcast: "podcast" };

function todoKey(item) {
  return `${item.module}|${item.title}|${item.detail}`;
}

function dismissed() {
  try {
    return JSON.parse(localStorage.getItem("rp-done") || "[]");
  } catch (error) {
    return [];
  }
}

function openTodos(items) {
  const done = dismissed();
  return items
    .filter((item) => !done.includes(todoKey(item)))
    .map((item, index) => [item, index])
    .sort((a, b) => a[0].priority - b[0].priority || a[1] - b[1])
    .map(([item]) => item);
}

function todoCard(item, compact = false) {
  const links = item.links.length
    ? `<ul>${item.links.map((l) => `<li>${link(l.url, l.label)}${l.note ? ` <span class="hint">· ${esc(l.note)}</span>` : ""}</li>`).join("")}</ul>` : "";
  const tab = MODULE_TAB[String(item.module).toLowerCase()];
  const buttons = item.action
    ? actionButton(item.action, item.action_label)
    : `${tab ? `<button class="btn ghost" data-goto="${tab}">Open ${esc(item.module)}</button>` : ""}<button class="btn ghost" data-done="${esc(todoKey(item))}">Mark done</button>`;
  return `<div class="todo p${item.priority}${compact ? " compact" : ""}">
    <div class="text">
      <span class="badge ${item.priority === 1 ? "bad" : item.priority === 2 ? "warn" : "grey"}">${esc(item.module)}${item.priority === 1 ? " · urgent" : ""}</span>
      <h4>${esc(item.title)}</h4>
      <div class="hint">${esc(item.detail)}</div>
      ${links}
    </div>
    <div class="actions">${buttons}</div>
  </div>`;
}

function runStrip(tasks) {
  const items = Object.entries(tasks || {}).filter(([, t]) => t.installed);
  if (!items.length) return "";
  const time = (stamp) => (stamp && stamp.includes("·") ? stamp.split("·")[1].trim() : stamp || "–");
  const rows = items.map(([key, t]) => {
    const state = t.ok ? `ran ${esc(time(t.last_run))}` : `<b>last run failed</b> (${esc(t.last_result || "error")})`;
    const label = t.ok ? "OK" : "Failed";
    return `<li class="${t.ok ? "ok" : "bad"}"><span class="dot" role="img" aria-label="${label}"></span>
      <span><b>${esc(t.name)}</b> · ${state} · next ${esc(time(t.next_run))}</span></li>`;
  }).join("");
  return `<ul class="runs" aria-label="Scheduled automations">${rows}</ul>`;
}

function launchCards(launch) {
  const tests = (launch && launch.tests) || [];
  const stateBadge = { done: "good", "last-tap": "warn", blocked: "bad", yours: "grey" };
  const cell = (value) => (value === null || value === undefined ? "–" : num(value));
  return tests.map((t) => {
    const whenBadge = t.when ? ` <span class="badge ${t.phase === "final" ? "grey" : ""}">${esc(t.when)}</span>` : "";
    if (!t.available) {
      return `<div class="card" style="margin-bottom:18px">
        <h3>Launch test: ${esc(t.name)}</h3>
        <p class="hint">No answer yet from the project's status file. The next try is in a few minutes.</p>
      </div>`;
    }
    const dates = [
      t.start_text && t.end_text ? `${esc(t.start_text)} to ${esc(t.end_text)}` : "",
      t.decision_day ? `decision ${esc(t.decision_day)}` : "",
      t.updated_text ? `counted ${esc(t.updated_text)}` : "",
    ].filter(Boolean).join(" · ");
    const counts = t.counts.map((c) => `<tr>
        <td>${esc(c.label)}</td>
        <td class="num"><b>${cell(c.have)}</b></td>
        <td class="num">${cell(c.need)}</td>
        <td class="num">${cell(c.stop)}</td>
      </tr>`).join("");
    const linkRow = (links) => `<div class="launch-links">${links.map((l) => link(l.url, l.label)).join("")}</div>`;
    const steps = t.needs_me.map((s) => `<tr>
        <td>${esc(s.title)}${s.private ? ` <span class="badge grey">private</span>` : ""}
          ${s.links.length ? linkRow(s.links) : ""}</td>
        <td><span class="badge ${stateBadge[s.status] || "grey"}">${esc(s.status_label)}</span>
          ${s.due ? `<div class="hint">by ${esc(s.due)}</div>` : ""}</td>
      </tr>`).join("");
    return `<div class="card module" style="margin-bottom:18px">
      <h3><span>Launch test: ${esc(t.name)}</span>${whenBadge}</h3>
      <div class="big">${esc(t.headline || "No verdict yet.")}</div>
      ${t.next_step ? `<div class="hint">${esc(t.next_step)}</div>` : ""}
      <div class="hint">${dates}${t.stale ? ` <span class="badge warn">offline: last good answer${t.read_at ? ` from ${esc(t.read_at)}` : ""}</span>` : ""}</div>
      <table style="margin-top:8px">
        <thead><tr><th>Measure</th><th class="num">Now</th><th class="num">Needed</th><th class="num">Stop below</th></tr></thead>
        <tbody>${counts}</tbody>
      </table>
      ${steps ? `<table style="margin-top:12px">
        <thead><tr><th>Needs you · ${num(t.open)} open</th><th>State</th></tr></thead>
        <tbody>${steps}</tbody>
      </table>` : ""}
      ${t.links.length ? linkRow(t.links) : ""}
    </div>`;
  }).join("");
}

function renderOverview(d) {
  const o = d.overview, h = d.hub, jobs = h.jobs, email = h.email;
  const next = o.next_post;

        return `<div class="card module podcast">
          <h3>${esc(p.show_title || "Podcast")} <span>${link(p.feed_url || p.site_url, "Feed")}${(h.podcast_promotion || {}).installed ? ` <button class="btn ghost" data-goto="podcast">Open</button>` : ""}</span></h3>
          ${latest ? `<div class="hint">ep ${num(latest.number)} · ${esc(latest.series_name || "–")} · ${mmss(latest.seconds)} min</div>
            <div class="big">${esc(latest.title)}</div>` : `<div class="big">No episodes yet</div>
            <div class="hint">The first one is built on the next slot.</div>`}

          <div class="hint">${num(p.episodes_total)} published${(() => {

            return ` · listed on ${num(promo.listed)} / ${num((promo.directories || []).length)} directories · ${week}`;

          <div class="hint">${reviewLine}</div>
          ${held.length ? `<div class="badge warn" style="margin-top:6px">${num(held.length)} held for review</div>
            <div class="actions">${actionButton("podcast:approve:all", "Approve & publish")}${actionButton("podcast:skip", "Skip", true)}</div>` : ""}

function listingsCard(l) {
  if (!l || !l.projects) return "";
  const yes = (value, good = "live", bad = "not yet") => value === true ? `<span class="badge good">${good}</span>`
    : value === false ? `<span class="badge grey">${bad}</span>` : `<span class="hint">–</span>`;
  const starCell = (r) => `${num(r.stars || 0)}${r.stars_baseline !== null && r.stars_baseline !== undefined && r.stars > r.stars_baseline ? ` <span class="badge good">+${num(r.stars - r.stars_baseline)}</span>` : ""}`;
  const m8ven = (r) => r.m8ven_grade ? `${r.m8ven_url ? link(r.m8ven_url, r.m8ven_grade) : esc(r.m8ven_grade)}${r.m8ven_grade_baseline && r.m8ven_grade_baseline !== r.m8ven_grade ? ` <span class="hint">was ${esc(r.m8ven_grade_baseline)}</span>` : ""}${r.m8ven_commit ? `<div class="hint">reads ${esc(r.m8ven_commit)}</div>` : ""}` : `<span class="hint">–</span>`;
  const glama = (r) => r.glama_url ? `${r.glama_live ? link(r.glama_url, "live") : `<span class="badge grey">not yet</span>`}${r.tdqs ? ` <span class="hint">TDQS ${esc(r.tdqs_grade || "")} ${esc(r.tdqs)}/5</span>` : ""}` : `<span class="hint">–</span>`;
  const badges = (r) => [r.badge_m8ven ? "M8ven" : "", r.badge_glama ? "Glama" : ""].filter(Boolean).join(" + ") || "–";
  const prBadge = (s) => ({ merged: "good", open: "warn", closed: "bad" }[s] || "grey");
  const queueBadge = (s) => ({ merged: "good", listed: "good", open: "warn", closed: "bad", failed: "bad" }[s] || "grey");
  const condition = (when) => {
    const stars = /^stars>=(\d+):(.+)$/.exec(when || "");
    return stars ? `when ${stars[2]} has ${stars[1]} stars` : (when || "");
  };
  const platformState = (p) => Object.entries(p.projects || {}).map(([id, s]) => s.listed === true
    ? `<span class="badge good">${s.url ? link(s.url, id) : esc(id)}</span>`
    : s.listed === false ? `<span class="badge grey">${esc(id)}: not yet</span>` : `<span class="hint">${esc(id)}</span>`).join(" ");
  const platformHow = (p) => {
    const step = p.step;
    if (step && step.done) return `<span class="badge good">done</span>`;
    const watched = p.monitored ? `<span class="badge good">watched</span> ` : "";
    if (!step) return watched || `<span class="hint">–</span>`;
    return `${watched}<span class="badge ${step.not_before ? "warn" : "grey"}">${step.not_before ? `by hand from ${esc(step.not_before)}` : `on hold · ${esc(condition(step.when))}`}</span>`;
  };
  const platforms = l.platforms || [];
  const queue = l.pr_queue || [];
  const count = (rows, test) => rows.filter(test).length;
  const platformsBlock = platforms.length ? `<details style="margin-top:14px"><summary><b>More places (${num(platforms.length)})</b>
      <span class="hint">· ${num(count(platforms, (p) => p.monitored))} watched by itself · ${num(count(platforms, (p) => p.step && p.step.not_before && !p.step.done))} by hand, one a day
      · ${num(count(platforms, (p) => p.step && !p.step.not_before && !p.step.done))} on hold until more stars</span></summary>
      <div class="scroll" tabindex="0" role="region" aria-label="More places"><table><thead><tr><th>Place</th><th>Projects</th><th>How</th><th>Why</th></tr></thead><tbody>
      ${platforms.map((p) => `<tr><td><b>${p.url ? link(p.url, p.name || p.id) : esc(p.name || p.id)}</b><div class="hint">${esc(p.kind || "")}</div></td>
        <td>${platformState(p)}</td><td>${platformHow(p)}</td><td class="hint">${esc(p.note || "")}</td></tr>`).join("")}
      </tbody></table></div></details>` : "";
  const queueBlock = queue.length ? `<h4 style="margin:14px 0 6px">List pull requests it opens by itself
      <span class="badge ${l.pr_queue_paused ? "bad" : l.auto_open_prs ? "good" : "grey"}">${l.pr_queue_paused ? "paused: too many closed" : l.auto_open_prs ? `on · up to ${num(l.auto_prs_per_day)} a day` : "off"}</span></h4>
      <p class="hint">${num(count(queue, (q) => q.url))} sent · ${num(count(queue, (q) => q.status === "waiting"))} waiting for their date. One per list, never re-opened. Switch: auto_open_prs in listings.json.</p>
      ${queue.map((q) => `<div>${q.url ? link(q.url, q.upstream) : esc(q.upstream)} <span class="badge ${queueBadge(q.status)}">${esc(q.status || "?")}</span>
        <span class="hint">· ${esc(q.project)}${q.status === "waiting" && q.waiting ? ` · ${esc(q.waiting)}` : ""}${q.reason ? ` · ${esc(q.reason)}` : ""}${q.error ? ` · ${esc(q.error)}` : ""}</span></div>`).join("")}` : "";
  return `
    <div class="card" style="margin-bottom:18px">
      <h3>Directory listings</h3>
      <p class="hint">Checked by itself every 6 hours (MCP Registry, M8ven, Glama, mcpservers.org, more directories, GitHub stars and PRs). Adds the Glama badge to a README when a listing goes live. Last check ${esc(l.checked_at ? niceDate(l.checked_at) : "never")} · stars counted from ${esc(l.baseline_date || "–")}.</p>
      <div class="scroll" tabindex="0" role="region" aria-label="Directory listings"><table><thead><tr><th>Project</th><th class="num">Stars</th><th>MCP Registry</th><th>M8ven</th><th>Glama</th><th>mcpservers.org</th><th>README badges</th></tr></thead><tbody>
      ${l.projects.map((r) => `<tr><td><b>${link(`https://github.com/${r.repo}`, r.id)}</b></td><td class="num">${starCell(r)}</td>
        <td>${r.mcp_server ? yes(r.registry_active, "active", "missing") : `<span class="hint">n/a</span>`}</td><td>${m8ven(r)}</td><td>${glama(r)}</td>
        <td>${r.mcp_server ? yes(r.mcpservers_listed, "listed", "waiting") : `<span class="hint">n/a</span>`}</td><td class="hint">${esc(badges(r))}</td></tr>`).join("")}
      </tbody></table></div>
      ${(l.prs || []).length ? `<h4 style="margin:14px 0 6px">Pull requests to lists</h4>
        ${l.prs.map((pr) => `<div>${link(pr.url, pr.key)} <span class="badge ${prBadge(pr.status)}">${esc(pr.status || "?")}</span> <span class="hint">· ${esc(pr.project)}${pr.comments ? ` · ${num(pr.comments)} comment(s)` : ""}</span></div>`).join("")}` : ""}
      ${queueBlock}
      ${platformsBlock}
      ${(l.steps || []).length ? `<h4 style="margin:14px 0 6px">Your steps (only the ones a script can't do)</h4>
        ${l.steps.map((s) => `<div class="todo p${s.priority || 2}"><h4>${esc(s.title)}</h4><div class="hint">${esc(s.detail || "")}</div>
          <div class="actions">${(s.links || []).map((x) => link(x.url, x.label)).join(" ")} ${actionButton(`promote:listingdone:${s.id}`, "Done")}</div></div>`).join("")}`
        : `<div class="empty" style="margin-top:10px">No listing steps waiting for you.</div>`}
      <div class="actions" style="margin-top:12px">${actionButton("promote:listings", "Check listings now", true)}</div>
    </div>`;
}

    </div>

      <h3>Controls</h3>

        ${p.youtube_ok ? "" : " <b>Add a YouTube API key so it can find creators.</b>"}</p>
      <div class="actions">
        ${p.awaiting_approval ? actionButton("promote:approveall", `Approve all ${p.awaiting_approval}`) : ""}
        ${p.mode === "review" ? actionButton("promote:mode:auto", "Switch to auto-send", true) : actionButton("promote:mode:review", "Switch to review (I press Send)", true)}
        ${p.paused ? actionButton("promote:resume", "Resume") : actionButton("promote:pause", "Pause", true)}
        ${actionButton("promote:discover", "Find creators now", true)}
        ${actionButton("promote:inbox", "Check replies", true)}
        ${actionButton("promote:plan", "Plan today", true)}
        ${p.youtube_ok ? "" : actionButton("promote:setkey", "Add YouTube key")}
        ${actionButton("promote:openproducts", "Edit products", true)}
      </div>
    </div>
    ${p.open_replies.length ? `<div class="card" style="margin-bottom:18px"><h3>Replies to answer</h3>
      ${p.open_replies.map((r) => `<div class="todo p1"><h4>${esc(r.creator.name)} · ${esc(r.product)}</h4><div class="hint">${esc(r.snippet)}</div>
        <div class="actions">${link(r.gmail, "Open in Gmail")} ${actionButton(`promote:mark:${r.creator.id}|interested`, "Interested")}${actionButton(`promote:mark:${r.creator.id}|declined`, "Not a fit", true)}</div></div>`).join("")}</div>` : ""}
    <h3>Today's e-mails</h3>
    ${p.queue.length ? p.queue.map(mailCard).join("") : `<div class="empty" style="margin-bottom:18px">Queue is empty. It fills each morning from the creator pool${p.youtube_ok ? "" : " once a YouTube key is added"}.</div>`}
    <div class="two">
      <div class="card"><h3>E-mails sent per day</h3>${lineChart(p.series, "No e-mails yet.")}</div>
      <div class="card"><h3>Per project</h3><div class="scroll"><table><thead><tr><th>Project</th><th class="num">Found</th><th class="num">Ready</th><th class="num">E-mailed</th><th class="num">Replies</th></tr></thead><tbody>
        ${p.products.map((r) => `<tr><td><b>${esc(r.name)}</b> ${r.active ? "" : `<span class="badge warn">needs niche</span>`}<div class="hint">${esc(r.topic || "")}</div></td><td class="num">${num(r.found)}</td><td class="num">${num(r.ready)}</td><td class="num">${num(r.emailed)}</td><td class="num">${num(r.replies)}</td></tr>`).join("")}
      </tbody></table></div></div>
    </div>
    <div class="two">
      <div class="card"><h3>Learning: e-mail wording</h3><p class="hint">Variants that get replies are picked more often.</p>${statRows(p.variants, "Variant")}</div>

    </div>
    <div class="card" style="margin-bottom:18px"><h3>Recently sent</h3>${p.recent.length ? `<div class="scroll"><table><thead><tr><th>Sent</th><th>Creator</th><th>Project</th><th>Subject</th></tr></thead><tbody>
      ${p.recent.map((r) => `<tr><td>${esc(niceDate(r.at))}</td><td>${link(r.creator.url, r.creator.name)} <span class="badge grey">${esc(r.creator.stage)}</span></td><td>${esc(r.product)}</td><td class="hint">${esc(r.subject)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">Nothing sent yet.</div>`}</div>
    ${listingsCard(p.listings)}
    <div class="card"><h3>Promotion log <span class="hint">(newest first)</span></h3><pre class="log">${esc(p.log.join("\n")) || "No activity yet."}</pre></div>`;
}

function weekBars(weeks) {
  if (!weeks || !weeks.length) return `<div class="empty">No weekly numbers yet.</div>`;
  const shown = weeks.slice(-12);
  const W = 520, H = 150, L = 36, B = 22, T = 12, gap = 6;
  const max = Math.max(1, ...shown);
  const step = (W - L) / shown.length;
  const bars = shown.map((value, i) => {
    const h = value ? Math.max(2, (value * (H - T - B)) / max) : 1;
    const label = i === shown.length - 1 ? "latest week" : `${shown.length - 1 - i} week${shown.length - 1 - i === 1 ? "" : "s"} before`;
    return `<rect class="${value ? "on" : "off"}" x="${(L + i * step + gap / 2).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(step - gap).toFixed(1)}" height="${h.toFixed(1)}"><title>${esc(label)}: ${num(value)}</title></rect>`;
  }).join("");
  const summary = `Downloads per week, last ${shown.length} weeks: ${shown.map(num).join(", ")}`;
  return `<svg class="chart spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}">
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W}" y2="${H - B}"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${num(max)}</text>
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">0</text>
    ${bars}
    <text x="${L}" y="${H - 4}">${shown.length} weeks ago</text>
    <text x="${W}" y="${H - 4}" text-anchor="end">latest week</text>
  </svg>`;
}

function renderPodcast(d) {
  const p = d.hub.podcast_promotion || {};
  const section = document.getElementById("podcast");
  const tabButton = document.querySelector('nav button[data-tab="podcast"]');
  if (tabButton) tabButton.hidden = !p.installed;
  if (!p.installed) {
    section.innerHTML = `<div class="empty">Podcast promotion isn't set up${p.error ? `: ${esc(p.error)}` : ""}.</div>`;
    return;
  }
  const mmss = (s) => (s === null || s === undefined) ? "–" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  const when = (stamp) => (stamp ? niceDate(String(stamp).replace("T", " ").slice(0, 16)) : "never");
  const dl = p.downloads || {};
  const directories = p.directories || [];
  const episodes = p.episodes || [];
  const STATUS_BADGE = {
    listed: `<span class="badge good">listed</span>`,
    submitted: `<span class="badge warn">submitted</span>`,
    todo: `<span class="badge bad">to do</span>`,
    unknown: `<span class="badge grey">could not check</span>`,
  };
  const downloadsNotice = {
    ok: "",
    waiting: "OP3 hasn't counted a download yet. It starts once podcast apps fetch episodes through the feed, which follows the directory listings above.",
    off: "Download counting is off: there is no \"analytics\" prefix in podcast_config.json.",
    error: `Couldn't reach OP3 (${esc(dl.detail || "no detail")}). No numbers are shown rather than zeros; it tries again within 15 minutes.`,
    checking: "Asking OP3 for the first time…",
  }[dl.status || "checking"] || "";

  const directoryRows = directories.map((row) => {
    const mark = row.marked
      ? actionButton(`podcast:unlisted:${row.id}`, "Undo", true)
      : row.status === "todo" || row.status === "unknown" ? actionButton(`podcast:listed:${row.id}`, "Mark as submitted") : "";
    const state = row.status === "listed"
      ? `checked by ${esc(row.checked_by)}${row.link ? ` · ${link(row.link, "their page")}` : ""}`
      : row.status === "submitted" ? `your mark, ${esc(when(row.marked))}`
      : row.status === "unknown" ? esc(row.detail || "") : "";
    return `<tr>
      <td><b>${esc(row.name)}</b><div class="hint">${esc(row.why)}</div></td>
      <td>${STATUS_BADGE[row.status] || esc(row.status)}<div class="hint">${state}</div></td>
      <td class="hint">${esc(row.needs)}</td>
      <td><div class="actions" style="margin-top:0">${link(row.url, "Open")}${mark}</div></td>
    </tr>`;
  }).join("");

  const announcedCell = (episode) => {
    const posts = (episode.announced || []).filter((post) => post.status === "posted");
    const other = (episode.announced || []).filter((post) => post.status !== "posted");
    return posts.map((post) => link(post.url, post.channel)).join(", ")
      + (other.length ? ` <span class="hint">(${other.map((post) => `${esc(post.channel)}: ${esc(post.status)}`).join(", ")})</span>` : "")
      || `<span class="hint">not announced</span>`;
  };
  const episodeRows = episodes.map((episode, index) => {
    const counts = episode.downloads || {};
    return `<tr>
      <td class="num">${index + 1}</td>
      <td>${link(episode.page, episode.title)} ${episode.top ? `<span class="badge good">most listened</span>` : ""}
        <div class="hint">ep ${num(episode.number)} · ${esc(episode.series_name)} · ${esc(when(episode.published))} · ${mmss(episode.seconds)} min</div></td>
      <td class="num">${num(counts.day7)}</td>
      <td class="num">${num(counts.all)}</td>
      <td>${announcedCell(episode)}</td>
    </tr>`;
  }).join("");

  const seriesRows = (p.series_comparison || []).map((row) => `<tr>
      <td><b>${esc(row.name)}</b></td>
      <td class="num">${num(row.episodes)}</td>
      <td class="num">${mmss(row.average_seconds)}</td>
      <td class="num">${row.average_downloads === null || row.average_downloads === undefined ? "–" : num(Math.round(row.average_downloads))}
        ${row.counted_episodes && row.counted_episodes < row.episodes ? `<div class="hint">${num(row.counted_episodes)} counted</div>` : ""}</td>
    </tr>`).join("");

  const audienceRows = (p.audience || []).map((row) => `<tr>
      <td><b>${esc(row.channel)}</b></td>
      <td class="num">${num(row.followers)}</td>
      <td class="num">${row.change > 0 ? "+" : ""}${num(row.change)} <span class="hint">since ${esc(when(row.first_day))}</span></td>
      <td class="hint">${esc(when(row.as_of))}</td>
    </tr>`).join("");

  section.innerHTML = `
    <div class="grid">
      ${kpi("Listed on", `${num(p.listed)} / ${num(directories.length)}`, p.todo && p.todo.length ? `To do: ${esc(p.todo.join(", "))}` : "Every directory done")}
      ${kpi("Downloads last week", dl.status === "ok" ? num(p.latest_week) : "–", dl.status === "ok" ? "From OP3" : esc(dl.status || "checking"))}
      ${kpi("Last 30 days", dl.status === "ok" ? num(dl.monthly) : "–", dl.counted_to ? `Counted to ${esc(when(dl.counted_to))}` : "")}
      ${kpi("Episodes announced", `${num(p.announced_episodes)} / ${num(episodes.length)}`, "Posted on at least one channel")}
    </div>
    <div class="card" style="margin-bottom:18px">
      <h3>Get listed</h3>
      <p class="hint">Paste the feed address once on each directory. Apple is checked by itself every 6 hours and Podcast Index once OP3 counts the show; for the others your "Mark as submitted" is the record.</p>
      <div class="actions" style="align-items:center">
        <code style="font-size:14px;padding:8px 10px;background:#eef0f2;border-radius:6px;word-break:break-all">${esc(p.feed_url)}</code>
        <button class="btn ghost" data-copy="${esc(p.feed_url)}">Copy feed address</button>
      </div>
      <div class="scroll" style="margin-top:12px"><table>
        <thead><tr><th>Directory</th><th>Status</th><th>What it needs</th><th></th></tr></thead>
        <tbody>${directoryRows}</tbody></table></div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <h3>Listeners <span class="hint">· downloads from OP3, checked ${esc(when((p.checked || {}).downloads))}${p.refreshing ? " · checking now" : ""}</span></h3>
      ${downloadsNotice ? `<p class="hint">${downloadsNotice}</p>` : ""}
      ${dl.status === "ok" ? weekBars(dl.weekly) : ""}
      <div class="actions">${actionButton("podcast:promo-refresh", "Check now", true)}${dl.stats_url ? link(dl.stats_url, "Full stats on OP3") : ""}</div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <h3>Episodes <span class="hint">· most listened first, then newest</span></h3>
      ${episodes.length ? `<div class="scroll"><table>
        <thead><tr><th class="num">#</th><th>Episode</th><th class="num">7 days</th><th class="num">All time</th><th>Announced on</th></tr></thead>
        <tbody>${episodeRows}</tbody></table></div>` : `<div class="empty">No published episodes yet.</div>`}
    </div>
    <div class="two">
      <div class="card"><h3>Series compared</h3>
        ${seriesRows ? `<div class="scroll"><table><thead><tr><th>Series</th><th class="num">Episodes</th><th class="num">Avg length</th><th class="num">Avg downloads</th></tr></thead>
        <tbody>${seriesRows}</tbody></table></div>` : `<div class="empty">No published episodes yet.</div>`}</div>
      <div class="card"><h3>Followers where it's announced</h3>
        <p class="hint">Account followers on the channels that carry the episode posts, not podcast listeners.</p>
        ${audienceRows ? `<div class="scroll"><table><thead><tr><th>Channel</th><th class="num">Followers</th><th class="num">Change</th><th>As of</th></tr></thead>
        <tbody>${audienceRows}</tbody></table></div>` : `<div class="empty">No follower counts yet. ReachPilot records them once a day for connected channels.</div>`}</div>
    </div>`;
}

function renderHelp(d) {
  document.getElementById("help-body").innerHTML = `
    <h2>How ReachPilot works</h2>
    <p class="hint">ReachPilot runs your outreach automations on a schedule and only asks you for the few things that need a human. The "To do" tab always shows what those are right now.</p>
    ${d.hub.help.map((m) => `<div class="mod"><h3>${esc(m.module)}</h3><dl>
      <dt>When</dt><dd>${esc(m.runs)}</dd>
      <dt>Does by itself</dt><dd>${esc(m.auto)}</dd>
      <dt>Needs you</dt><dd>${esc(m.you)}</dd></dl></div>`).join("")}
    <div class="mod"><h3>Safety rules</h3><p class="hint">It never solves CAPTCHAs or human checks, never creates accounts or signs in for you, and never posts or e-mails anything made up. Everything stays on this PC; job and e-mail data is never uploaded to GitHub.</p></div>
    <div class="actions"><button class="btn" id="help-close">Close</button>${actionButton("open_modules", "Open modules folder", true)}</div>`;
}

function showTab(id) {
  try {
    sessionStorage.setItem("rp-tab", id);
  } catch (error) {}
  document.querySelectorAll("nav button[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
  document.querySelectorAll("main section").forEach((s) => (s.hidden = s.id !== id));
}

document.getElementById("help-open").addEventListener("click", () => {
  if (latest) renderHelp(latest);
  document.getElementById("help").showModal();
});
document.getElementById("help").addEventListener("click", (event) => {
  if (event.target.id === "help-close" || event.target.id === "help") document.getElementById("help").close();
});

async function load() {
  try {
    const response = await fetch("/api/data", { cache: "no-store" });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    latest = data;
    renderOverview(data);
    renderTodo(data);
    renderLinkedin(data);
    renderJobs(data);
    renderEmail(data);
    renderPromote(data);
    renderPodcast(data);
    renderSchedule(data);
    renderReach(data);
    renderGithub(data);
    renderLearning(data);
    renderLog(data);
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  } catch (error) {
    document.getElementById("updated").textContent = "Couldn't load data: " + error.message;
  }
}

document.querySelectorAll("nav button[data-tab]").forEach((button) => {
  button.addEventListener("click", () => showTab(button.dataset.tab));
});
document.getElementById("nav-more").addEventListener("click", (event) => {
  const nav = document.getElementById("tabs");
  const open = nav.classList.toggle("open");
  event.currentTarget.setAttribute("aria-expanded", String(open));
  event.currentTarget.textContent = open ? "Less ▴" : "More ▾";
});

load();
setInterval(load, 60000);

// Auto-update: the local server restarts itself when its code changes; reload onto the new code,
// keeping the open tab. Only for the local app (the public demo has no server behind it, TOKEN is "demo").
if (location.hostname === "127.0.0.1" && TOKEN !== "demo") {
  let knownVersion = null;
  setInterval(async () => {
    try {
      const response = await fetch("/version", { cache: "no-store" });
      if (!response.ok) return;
      const version = await response.json();
      const changed = knownVersion && (version.boot !== knownVersion.boot || version.page !== knownVersion.page);
      knownVersion = knownVersion && !changed ? knownVersion : version;
      const busy = document.querySelector("button[disabled]") || document.querySelector("dialog[open]");
      if (changed && !busy) {
        try {
          sessionStorage.setItem("rp-updated", "1");
        } catch (error) {}
        location.reload();
      }
    } catch (error) {
      // server is restarting: try again on the next tick
    }
  }, 10000);
}
try {
  const savedTab = sessionStorage.getItem("rp-tab");
  if (savedTab && document.getElementById(savedTab)) showTab(savedTab);
  if (sessionStorage.getItem("rp-updated")) {
    sessionStorage.removeItem("rp-updated");
    toast("ReachPilot updated to the latest version.");
  }
} catch (error) {}
</script>
