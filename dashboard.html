function listingsCard(l) {
  if (!l || !l.projects) return "";
  const yes = (value, good = "live", bad = "not yet") => value === true ? `<span class="badge good">${good}</span>`
    : value === false ? `<span class="badge grey">${bad}</span>` : `<span class="hint">–</span>`;
  const starCell = (r) => `${num(r.stars || 0)}${r.stars_baseline !== null && r.stars_baseline !== undefined && r.stars > r.stars_baseline ? ` <span class="badge good">+${num(r.stars - r.stars_baseline)}</span>` : ""}`;
  const m8ven = (r) => r.m8ven_grade ? `${r.m8ven_url ? link(r.m8ven_url, r.m8ven_grade) : esc(r.m8ven_grade)}${r.m8ven_grade_baseline && r.m8ven_grade_baseline !== r.m8ven_grade ? ` <span class="hint">was ${esc(r.m8ven_grade_baseline)}</span>` : ""}${r.m8ven_commit ? `<div class="hint">reads ${esc(r.m8ven_commit)}</div>` : ""}` : `<span class="hint">–</span>`;
  const glama = (r) => r.glama_url ? `${r.glama_live ? link(r.glama_url, "live") : `<span class="badge grey">not yet</span>`}${r.tdqs ? ` <span class="hint">TDQS ${esc(r.tdqs_grade || "")} ${esc(r.tdqs)}/5</span>` : ""}` : `<span class="hint">–</span>`;
  const badges = (r) => [r.badge_m8ven ? "M8ven" : "", r.badge_glama ? "Glama" : ""].filter(Boolean).join(" + ") || "–";
  const prBadge = (s) => ({ merged: "good", open: "warn", closed: "bad" }[s] || "grey");
  const queueBadge = (s) => ({ merged: "good", listed: "good", open: "warn", closed: "bad", failed: "bad" }[s] || "grey");
  const condition = (when) => {
    const stars = /^stars>=(\d+):(.+)$/.exec(when || "");
    return stars ? `when ${stars[2]} has ${stars[1]} stars` : (when || "");
  };
  const platformState = (p) => Object.entries(p.projects || {}).map(([id, s]) => s.listed === true
    ? `<span class="badge good">${s.url ? link(s.url, id) : esc(id)}</span>`
    : s.listed === false ? `<span class="badge grey">${esc(id)}: not yet</span>` : `<span class="hint">${esc(id)}</span>`).join(" ");
  const platformHow = (p) => {
    const step = p.step;
    if (step && step.done) return `<span class="badge good">done</span>`;
    const watched = p.monitored ? `<span class="badge good">watched</span> ` : "";
    if (!step) return watched || `<span class="hint">–</span>`;
    return `${watched}<span class="badge ${step.not_before ? "warn" : "grey"}">${step.not_before ? `by hand from ${esc(step.not_before)}` : `on hold · ${esc(condition(step.when))}`}</span>`;
  };
  const platforms = l.platforms || [];
  const queue = l.pr_queue || [];
  const count = (rows, test) => rows.filter(test).length;
  const platformsBlock = platforms.length ? `<details style="margin-top:14px"><summary><b>More places (${num(platforms.length)})</b>
      <span class="hint">· ${num(count(platforms, (p) => p.monitored))} watched by itself · ${num(count(platforms, (p) => p.step && p.step.not_before && !p.step.done))} by hand, one a day
      · ${num(count(platforms, (p) => p.step && !p.step.not_before && !p.step.done))} on hold until more stars</span></summary>
      <div class="scroll" tabindex="0" role="region" aria-label="More places"><table><thead><tr><th>Place</th><th>Projects</th><th>How</th><th>Why</th></tr></thead><tbody>
      ${platforms.map((p) => `<tr><td><b>${p.url ? link(p.url, p.name || p.id) : esc(p.name || p.id)}</b><div class="hint">${esc(p.kind || "")}</div></td>
        <td>${platformState(p)}</td><td>${platformHow(p)}</td><td class="hint">${esc(p.note || "")}</td></tr>`).join("")}
      </tbody></table></div></details>` : "";
  const queueBlock = queue.length ? `<h4 style="margin:14px 0 6px">List pull requests it opens by itself
      <span class="badge ${l.pr_queue_paused ? "bad" : l.auto_open_prs ? "good" : "grey"}">${l.pr_queue_paused ? "paused: too many closed" : l.auto_open_prs ? `on · up to ${num(l.auto_prs_per_day)} a day` : "off"}</span></h4>
      <p class="hint">${num(count(queue, (q) => q.url))} sent · ${num(count(queue, (q) => q.status === "waiting"))} waiting for their date. One per list, never re-opened. Switch: auto_open_prs in listings.json.</p>
      ${queue.map((q) => `<div>${q.url ? link(q.url, q.upstream) : esc(q.upstream)} <span class="badge ${queueBadge(q.status)}">${esc(q.status || "?")}</span>
        <span class="hint">· ${esc(q.project)}${q.status === "waiting" && q.waiting ? ` · ${esc(q.waiting)}` : ""}${q.reason ? ` · ${esc(q.reason)}` : ""}${q.error ? ` · ${esc(q.error)}` : ""}</span></div>`).join("")}` : "";
  return `
    <div class="card">
      <h3>Directory listings</h3>
      <p class="hint">Checked by itself every 6 hours (MCP Registry, M8ven, Glama, mcpservers.org, more directories, GitHub stars and PRs). Adds the Glama badge to a README when a listing goes live. Last check ${esc(l.checked_at ? niceDate(l.checked_at) : "never")} · stars counted from ${esc(l.baseline_date || "–")}.</p>
      <div class="scroll" tabindex="0" role="region" aria-label="Directory listings"><table><thead><tr><th>Project</th><th class="num">Stars</th><th>MCP Registry</th><th>M8ven</th><th>Glama</th><th>mcpservers.org</th><th>README badges</th></tr></thead><tbody>
      ${l.projects.map((r) => `<tr><td><b>${link(`https://github.com/${r.repo}`, r.id)}</b></td><td class="num">${starCell(r)}</td>
        <td>${r.mcp_server ? yes(r.registry_active, "active", "missing") : `<span class="hint">n/a</span>`}</td><td>${m8ven(r)}</td><td>${glama(r)}</td>
        <td>${r.mcp_server ? yes(r.mcpservers_listed, "listed", "waiting") : `<span class="hint">n/a</span>`}</td><td class="hint">${esc(badges(r))}</td></tr>`).join("")}
      </tbody></table></div>
      ${(l.prs || []).length ? `<h4 style="margin:14px 0 6px">Pull requests to lists</h4>
        ${l.prs.map((pr) => `<div>${link(pr.url, pr.key)} <span class="badge ${prBadge(pr.status)}">${esc(pr.status || "?")}</span> <span class="hint">· ${esc(pr.project)}${pr.comments ? ` · ${num(pr.comments)} comment(s)` : ""}</span></div>`).join("")}` : ""}
      ${queueBlock}
      ${platformsBlock}
      ${(l.steps || []).length ? `<h4 style="margin:14px 0 6px">Your steps (only the ones a script can't do)</h4>
        ${l.steps.map((s) => `<div class="todo p${s.priority || 2}">
          <div class="text"><h4>${esc(s.title)}</h4><div class="hint">${esc(s.detail || "")}</div>
            ${(s.links || []).length ? `<div class="launch-links">${s.links.map((x) => link(x.url, x.label)).join(" ")}</div>` : ""}</div>
          <div class="actions">${actionButton(`promote:listingdone:${s.id}`, "Done")}</div></div>`).join("")}`
        : `<div class="empty" style="margin-top:10px">No listing steps waiting for you.</div>`}
      <div class="actions" style="margin-top:12px">${actionButton("promote:listings", "Check listings now", true)}</div>
    </div>`;
}

function renderPromote(d) {
  const p = d.hub.promote;
  const section = document.getElementById("promote");
  if (!p.installed) {
    section.innerHTML = `${pageHead("Projects", "Creator outreach")}<div class="empty">Creator outreach isn't set up${p.error ? `: ${esc(p.error)}` : ""}.</div>`;
    return;
  }
  const task = d.hub.tasks.promote || {};
  const pct = (value) => (value === null || value === undefined ? "–" : Math.round(value * 100) + "%");
  const subs = (c) => (c.platform === "youtube" ? `${num(c.subscribers || 0)} subs` : esc(c.platform || ""));
  const statusBadge = (m) => ({ queued: `<span class="badge warn">waiting for you</span>`, approved: `<span class="badge good">approved</span>`,
    held: `<span class="badge bad">held</span>`, failed: `<span class="badge bad">failed</span>` }[m.status] || "");
  const mailCard = (m) => `
    <div class="mail">
      <div class="mail-head">
        <div><b>${link(m.creator.url, m.creator.name)}</b> <span class="hint">· ${subs(m.creator)} · ${esc(m.creator.type || "")} · for <b>${esc(m.product)}</b> · ${esc(m.kind.replace("_", "-"))}</span> ${statusBadge(m)}
          <div class="hint">To ${esc(m.to_email)} · e-mail found on ${link(m.creator.email_source, "their channel")} · their video: ${link(m.creator.recent_url, m.creator.recent_title || "–")}</div></div>
        <div class="actions">
          ${m.status === "queued" || m.status === "approved" ? actionButton(`promote:send:${m.id}`, "Send now") : actionButton(`promote:retry:${m.id}`, "Retry")}
          ${m.status === "queued" ? actionButton(`promote:approve:${m.id}`, "Approve", true) : ""}
          ${actionButton(`promote:skip:${m.id}`, "Skip", true)}
          ${actionButton(`promote:mark:${m.creator.id}|suppressed`, "Never contact", true)}
        </div>
      </div>
      ${m.error ? `<div class="problem">${esc(m.error)}${m.unsure ? " · The connection broke while sending, so it may have arrived: check Sent in Gmail before a retry." : ""}</div>` : ""}
      <div class="subject">${esc(m.subject)} <span class="hint">· variant ${esc(m.variant)}</span></div>
      <pre class="text">${esc(m.body)}</pre>
    </div>`;
  const statRows = (rows, label) => rows.length
    ? `<table><thead><tr><th>${label}</th><th class="num">E-mailed</th><th class="num">Replies</th><th class="num">Rate</th></tr></thead><tbody>
       ${rows.map((r) => `<tr><td>${esc(r.key || r.variant)}</td><td class="num">${num(r.sent)}</td><td class="num">${num(r.replies)}</td><td class="num">${pct(r.rate)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">Nothing sent yet.</div>`;
  // Two lists: what is stuck (held by a rule, or failed while sending) and what waits to go out. Each has one
  // button for the whole list. "Send all now" is Send now on each, so it asks first and says when it passes the cap.
  const stuck = p.queue.filter((m) => m.status === "held" || m.status === "failed");
  const waiting = p.queue.filter((m) => m.status === "queued" || m.status === "approved");
  const overCap = p.sent_today + waiting.length > p.cap
    ? ` Today's cap is ${num(p.cap)} and ${num(p.sent_today)} went out already, so this goes past it.` : "";
  const sendAll = !waiting.length ? ""
    : p.paused ? `<p class="hint">Paused: nothing goes out until you press Resume.</p>`
    : `<div class="actions bulk">${actionButton("promote:sendall", `Send all now (${waiting.length})`, false,
        `Send ${waiting.length} e-mail${waiting.length === 1 ? "" : "s"} to creators now?${overCap} Each one goes out at once and cannot be taken back.`)}
        <span class="hint">One after another, like pressing Send now on each: no waiting for the send window or today's cap. Keep this page open until it answers.</span></div>`;
  section.innerHTML = `
    ${pageHead("Projects", "Creator outreach", "E-mails to creators who might cover a project, and their replies.")}
    <div class="grid">
      ${kpi("Sent today", `${num(p.sent_today)} / ${num(p.cap)}`, "Warm-up cap grows to 20 a day")}
      ${kpi("Waiting for you", num(p.awaiting_approval), p.mode === "review" ? "Review mode: you press Send" : "Auto mode")}
      ${kpi("Creators contacted", num(p.contacted), `${num(p.pool)} ready · ${num(p.no_email)} without public e-mail`)}
      ${kpi("Replies", num(p.replies), `Reply rate ${pct(p.reply_rate)} · ${num(p.interested)} interested`)}
      ${kpi("Mode", p.paused ? "Paused" : p.mode === "auto" ? "Auto" : "Review", `Sends ${p.send_window[0]}:00–${p.send_window[1]}:00`)}
      ${kpi("Next run", esc(task.next_run || "–"), `Replies checked ${esc(p.last_reply_check ? niceDate(p.last_reply_check) : "–")}`)}
    </div>
    <div class="card">
      <h3>Controls</h3>
      <p class="hint">Sends from your Gmail relay with replies going to ${esc(p.reply_to)}. One e-mail per creator, one follow-up after 5 days, stops when they reply.
        ${p.youtube_ok ? "" : " <b>Add a YouTube API key so it can find creators.</b>"}</p>
      <div class="actions">
        ${p.awaiting_approval ? actionButton("promote:approveall", `Approve all ${p.awaiting_approval}`) : ""}
        ${p.mode === "review" ? actionButton("promote:mode:auto", "Switch to auto-send", true) : actionButton("promote:mode:review", "Switch to review (I press Send)", true)}
        ${p.paused ? actionButton("promote:resume", "Resume") : actionButton("promote:pause", "Pause", true)}
        ${actionButton("promote:discover", "Find creators now", true)}
        ${actionButton("promote:inbox", "Check replies", true)}
        ${actionButton("promote:plan", "Plan today", true)}
        ${p.youtube_ok ? "" : actionButton("promote:setkey", "Add YouTube key")}
        ${actionButton("promote:openproducts", "Edit products", true)}
      </div>
    </div>
    ${p.open_replies.length ? `<div class="card"><h3>Replies to answer</h3>
      ${p.open_replies.map((r) => `<div class="todo p1">
        <div class="text"><h4>${esc(r.creator.name)} · ${esc(r.product)}</h4><div class="hint">${esc(r.snippet)}</div>
          <div class="launch-links">${link(r.gmail, "Open in Gmail")}</div></div>
        <div class="actions">${actionButton(`promote:mark:${r.creator.id}|interested`, "Interested")}${coveredButton(r.creator)}${actionButton(`promote:mark:${r.creator.id}|declined`, "Not a fit", true)}</div></div>`).join("")}</div>` : ""}
    ${(p.coverage || []).length ? `<div class="card"><h3>Creators who covered a project</h3>
      <p class="hint">Each one is thanked once in the next post about that project and listed on its watch page.</p>
      <div class="scroll"><table><thead><tr><th>Creator</th><th>Project</th><th>Their video</th><th>Thanked in a post</th></tr></thead><tbody>
      ${p.coverage.map((c) => `<tr><td>${link(c.creator_url, c.creator)}</td><td>${esc(c.product)}</td><td>${link(c.url, "open")}</td><td>${c.credited ? `<span class="badge good">yes</span>` : `<span class="badge warn">in the next post</span>`}</td></tr>`).join("")}
      </tbody></table></div></div>` : ""}
    ${stuck.length ? `<div class="card"><h3>Held or failed <span class="hint">· ${stuck.length}</span></h3>
      <div class="actions bulk">${actionButton("promote:retryall", `Retry all ${stuck.length}`)}
        <span class="hint">Puts back each one that passes the rules again. One that may already have arrived is left for you to check.</span></div>
      ${stuck.map(mailCard).join("")}</div>` : ""}
    <div class="card"><h3>Today's e-mails${waiting.length ? ` <span class="hint">· ${waiting.length} waiting</span>` : ""}</h3>
      ${sendAll}
      ${waiting.length ? waiting.map(mailCard).join("")
        : p.queue.length ? `<div class="empty">Nothing is waiting to go out.</div>`
        : `<div class="empty">Queue is empty. It fills each morning from the creator pool${p.youtube_ok ? "" : " once a YouTube key is added"}.</div>`}

function weekBars(weeks) {
  if (!weeks || !weeks.length) return `<div class="empty">No weekly numbers yet.</div>`;
  const shown = weeks.slice(-12);
  const W = 520, H = 150, L = 36, B = 22, T = 12, gap = 6;
  const max = Math.max(1, ...shown);
  const step = (W - L) / shown.length;
  const bars = shown.map((value, i) => {
    const h = value ? Math.max(2, (value * (H - T - B)) / max) : 1;
    const label = i === shown.length - 1 ? "latest week" : `${shown.length - 1 - i} week${shown.length - 1 - i === 1 ? "" : "s"} before`;
    return `<rect class="${value ? "on" : "off"}" x="${(L + i * step + gap / 2).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(step - gap).toFixed(1)}" height="${h.toFixed(1)}"><title>${esc(label)}: ${num(value)}</title></rect>`;
  }).join("");
  const summary = `Downloads per week, last ${shown.length} weeks: ${shown.map(num).join(", ")}`;
  return `<svg class="chart spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}">
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W}" y2="${H - B}"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${num(max)}</text>
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">0</text>
    ${bars}
    <text x="${L}" y="${H - 4}">${shown.length} weeks ago</text>
    <text x="${W}" y="${H - 4}" text-anchor="end">latest week</text>
  </svg>`;
}

// ---- Sidebar groups, folding and arranging (design.md: Layout). What you fold or move is remembered in this browser.
// The pages are drawn again every minute, so the state is put back on every new drawing (dress), not kept in the nodes.
const CHEVRON = `<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const NO_ARRANGE = ["todo", "tradebot"];  // To do is sorted by urgency; TradeBot's own frame stays where it is
let arranging = "";  // the page whose blocks are being moved, "" when none

function stored(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value && typeof value === "object" && Array.isArray(value) === Array.isArray(fallback) ? value : fallback;
  } catch (error) {
    return fallback;
  }
}

function store(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {}
}

// A group shows its pages when it is open. Folded, it shows its label, how many pages it holds and the page you are on.
function drawGroups() {
  const open = stored("rp-nav-open", []);
  document.querySelectorAll(".nav-group").forEach((group) => {
    const label = group.querySelector(".nav-label");
    const pages = group.querySelectorAll('button[role="tab"]:not([hidden])').length;
    const isOpen = open.includes(group.dataset.group);
    group.hidden = !pages;
    group.classList.toggle("folded", !isOpen);
    label.setAttribute("aria-expanded", String(isOpen));
    label.querySelector(".group-count").textContent = isOpen ? "" : pages;
  });
}

// The name of a block: its heading without the counts, badges and buttons that change from day to day.
function blockName(block) {
  if (block.classList.contains("grid")) return "Numbers";
  if (block.classList.contains("two")) {
    const cards = [...block.children].filter((child) => child.matches(".card"));
    return `Side by side: ${cards.map(blockName).join(", ")}`;
  }
  const heading = block.querySelector(":scope > h3");
  if (!heading) return "Block";
  const copy = heading.cloneNode(true);
  copy.querySelectorAll(".hint, .badge, .btn, button, svg").forEach((node) => node.remove());
  return copy.textContent.replace(/\s+/g, " ").trim().replace(/\s*[·:]$/, "") || "Block";
}

// What can be moved: the blocks of a page, and the blocks inside a side-by-side row.
function unitsOf(container) {
  return [...container.children].filter((child) => child.matches(".card, .grid, .two") && !child.hidden);
}

function orderKey(container) {
  const section = container.closest("section");
  return container === section ? section.id : `${section.id}>${container.dataset.unit}`;
}

function dress() {
  const folded = stored("rp-folded", []);
  const orders = stored("rp-order", {});
  document.querySelectorAll("main > section").forEach((section) => {
    // Folding: every block with a heading gets a chevron in front of it
    const cards = [...section.querySelectorAll(".card")].filter((card) => card.querySelector(":scope > h3"));
    cards.forEach((card) => {
      const heading = card.querySelector(":scope > h3");
      if (!card.dataset.fold) {
        const taken = cards.map((other) => other.dataset.fold);
        const base = `${section.id}|${blockName(card)}`;
        let key = base;
        for (let count = 2; taken.includes(key); count += 1) key = `${base} #${count}`;
        card.dataset.fold = key;
        card.classList.add("foldable");
      }
      if (!heading.querySelector(":scope > .fold")) {
        heading.insertAdjacentHTML("afterbegin", `<button type="button" class="fold" aria-label="${esc(`Fold or open: ${blockName(card)}`)}">${CHEVRON}</button>`);
      }
      const isFolded = folded.includes(card.dataset.fold);
      card.classList.toggle("folded", isFolded);
      heading.querySelector(":scope > .fold").setAttribute("aria-expanded", String(!isFolded));
    });

    // Arranging: a saved order is put back; a block that is not in it keeps its place
    const canArrange = !NO_ARRANGE.includes(section.id);
    const containers = canArrange ? [section, ...section.querySelectorAll(":scope > .two")] : [];
    let movable = 0;
    containers.forEach((container) => {
      const units = unitsOf(container);
      if (units.some((unit) => !unit.dataset.unit)) {
        const taken = [];
        units.forEach((unit, index) => {
          const base = unit.classList.contains("two") ? `Row: ${blockName(unit.querySelector(":scope > .card") || unit)}` : blockName(unit);
          let key = base;
          for (let count = 2; taken.includes(key); count += 1) key = `${base} #${count}`;
          taken.push(key);
          unit.dataset.unit = key;
          unit.dataset.natural = index;
          unit.classList.add("unit");
        });
      }
      const saved = orders[orderKey(container)] || [];
      const natural = [...units].sort((a, b) => a.dataset.natural - b.dataset.natural);
      const known = natural.filter((unit) => saved.includes(unit.dataset.unit))
        .sort((a, b) => saved.indexOf(a.dataset.unit) - saved.indexOf(b.dataset.unit));
      const wanted = natural.map((unit) => (saved.includes(unit.dataset.unit) ? known.shift() : unit));
      if (wanted.some((unit, index) => unit !== units[index])) {
        const marks = units.map((unit) => unit.parentNode.insertBefore(document.createComment(""), unit));
        wanted.forEach((unit, index) => marks[index].replaceWith(unit));
      }
      if (units.length > 1) movable += units.length;
      wanted.forEach((unit, index) => {
        let bar = unit.querySelector(":scope > .arrange-bar");
        if (arranging !== section.id) {
          if (bar) bar.remove();
          return;
        }
        if (!bar) {
          unit.insertAdjacentHTML("afterbegin", `<div class="arrange-bar"><span class="name">${esc(blockName(unit))}</span>
            <button type="button" class="tool" data-move="-1">Up</button><button type="button" class="tool" data-move="1">Down</button></div>`);
          bar = unit.firstElementChild;
        }
        bar.querySelector('[data-move="-1"]').disabled = index === 0;
        bar.querySelector('[data-move="1"]').disabled = index === wanted.length - 1;
      });
    });
    section.classList.toggle("arranging", arranging === section.id);

    // The tools under the page title: fold or open every block, and move blocks
    const head = section.querySelector(".page-head");
    if (!head) return;
    const allFolded = cards.length > 0 && cards.every((card) => card.classList.contains("folded"));
    const moving = arranging === section.id;
    const tools = `${cards.length > 1 && !moving ? `<button type="button" class="tool" data-fold-all>${allFolded ? "Open all" : "Fold all"}</button>` : ""}${
      movable ? `<button type="button" class="tool" data-arrange aria-pressed="${moving}">${moving ? "Done" : "Arrange"}</button>` : ""}${
      moving ? `<button type="button" class="tool" data-reset-order>Reset order</button>` : ""}`;
    let row = head.querySelector(":scope > .page-tools");
    if (!tools) {
      if (row) row.remove();
    } else if (!row || row.dataset.tools !== tools) {
      if (!row) row = head.appendChild(Object.assign(document.createElement("div"), { className: "page-tools" }));
      row.innerHTML = tools;
      row.dataset.tools = tools;
    }
  });
  dresser.takeRecords();  // what dress itself changed needs no second pass
}

const dresser = new MutationObserver(dress);
dresser.observe(document.querySelector("main"), { childList: true, subtree: true });

function moveUnit(unit, step) {
  const container = unit.parentElement;
  const units = unitsOf(container);
  const from = units.indexOf(unit), to = from + step;
  if (to < 0 || to >= units.length) return;
  const keys = units.map((other) => other.dataset.unit);
  [keys[from], keys[to]] = [keys[to], keys[from]];
  // A block that is not on the page right now (no reply to answer today) keeps its place after its old neighbour
  const orders = stored("rp-order", {});
  const before = orders[orderKey(container)] || [];
  before.forEach((key, index) => {
    if (keys.includes(key)) return;
    const neighbour = before.slice(0, index).reverse().find((other) => keys.includes(other));
    keys.splice(neighbour ? keys.indexOf(neighbour) + 1 : 0, 0, key);
  });
  orders[orderKey(container)] = keys;
  store("rp-order", orders);
  dress();
  const again = unit.querySelector(`:scope > .arrange-bar [data-move="${step}"]`);
  (again && !again.disabled ? again : unit.querySelector(":scope > .arrange-bar .tool:not(:disabled)")).focus();
}

document.addEventListener("click", (event) => {
  const group = event.target.closest(".nav-label[aria-expanded]");
  if (group) {
    const id = group.parentElement.dataset.group;
    const open = stored("rp-nav-open", []);
    store("rp-nav-open", open.includes(id) ? open.filter((other) => other !== id) : [...open, id]);
    drawGroups();
    return;
  }
  const section = event.target.closest("main > section");
  if (!section) return;
  const move = event.target.closest("[data-move]");
  if (move) {
    moveUnit(move.closest(".unit"), Number(move.dataset.move));
    return;
  }
  if (event.target.closest("[data-arrange]")) {
    arranging = arranging === section.id ? "" : section.id;
    dress();
    section.querySelector("[data-arrange]").focus();
    return;
  }
  if (event.target.closest("[data-reset-order]")) {
    const orders = stored("rp-order", {});
    Object.keys(orders).filter((key) => key === section.id || key.startsWith(`${section.id}>`)).forEach((key) => delete orders[key]);
    store("rp-order", orders);
    dress();
    toast("Blocks are back in their first order.");
    return;
  }
  const cards = [...section.querySelectorAll(".foldable")];
  if (event.target.closest("[data-fold-all]")) {
    const keys = cards.map((card) => card.dataset.fold);
    const rest = stored("rp-folded", []).filter((key) => !keys.includes(key));
    store("rp-folded", cards.every((card) => card.classList.contains("folded")) ? rest : [...rest, ...keys]);
    dress();
    return;
  }
  // A click on a heading folds its block, unless it lands on a link or a button in the heading or selects text
  const heading = event.target.closest(".foldable > h3");
  const onControl = event.target.closest("a, button, input, select, textarea, summary, label");
  if (!heading || (onControl && !onControl.classList.contains("fold"))) return;
  const picked = getSelection();
  if (!onControl && picked && !picked.isCollapsed && heading.contains(picked.anchorNode)) return;
  const key = heading.parentElement.dataset.fold;
  const folded = stored("rp-folded", []);
  store("rp-folded", folded.includes(key) ? folded.filter((other) => other !== key) : [...folded, key]);
  dress();
});

drawGroups();

load();
setInterval(load, 60000);

// Auto-update: the local server restarts itself when its code changes; reload onto the new code,
// keeping the open tab. Only for the local app (the public demo has no server behind it, TOKEN is "demo").
if (location.hostname === "127.0.0.1" && TOKEN !== "demo") {
  document.getElementById("phone-open").hidden = false;  // the QR code opens on this PC, so not in a snapshot or the demo
  let knownVersion = null;
  setInterval(async () => {
    try {
      const response = await fetch("/version", { cache: "no-store" });
      if (!response.ok) return;
      const version = await response.json();
      const changed = knownVersion && (version.boot !== knownVersion.boot || version.page !== knownVersion.page);
      knownVersion = knownVersion && !changed ? knownVersion : version;
      const busy = document.querySelector("button[disabled]") || document.querySelector("dialog[open]");
      if (changed && !busy) {
        try {
          sessionStorage.setItem("rp-updated", "1");
        } catch (error) {}
        location.reload();
      }
    } catch (error) {
      // server is restarting: try again on the next tick
    }
  }, 10000);
}
try {
  const savedTab = sessionStorage.getItem("rp-tab");
  if (savedTab && document.getElementById(savedTab)) showTab(savedTab);
  if (sessionStorage.getItem("rp-updated")) {
    sessionStorage.removeItem("rp-updated");
    toast("ReachPilot updated to the latest version.");
  }
} catch (error) {}
</script>
</body>
</html>
