<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReachPilot</title>
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Design system: design.md. Paper, hairline rules, serif display, mono metadata, one blue accent.
     Breakpoints: 900px (the sidebar becomes a top bar with a drawer) and 760px (phone). */
  @font-face { font-family: "Instrument Serif"; src: url("/fonts/instrument-serif-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist"; src: url("/fonts/geist-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/fonts/geist-mono-normal.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; }
  :root {
    --bg: #f4f1ea; --surface: #fffdf8; --sunken: #ebe6db;
    --ink: #1b1a17; --ink-2: #4a463e; --muted: #5f5a52; --line: #e1dbcf; --line-strong: #cbc3b3;
    --blue: #0a5aa8; --blue-soft: #dfe8f2; --green: #05693b; --green-soft: #dcebdf;
    --amber: #7d4c05; --amber-soft: #f6e8c9; --red: #b42318; --red-soft: #f6dedb;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, Cambria, serif;
    --sans: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "Geist Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    --side: 232px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14.5px/1.55 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* Shell: a sidebar with grouped pages on the left, the page on the right */
  .app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 14px 16px;
    border-right: 1px solid var(--line); background: var(--bg); overflow-y: auto; }
  .brand { margin: 0; display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font: 400 25px/1 var(--serif);
    letter-spacing: -.01em; white-space: nowrap; }
  .logo { width: 26px; height: 26px; display: block; }
  .status { display: flex; flex-direction: column; gap: 2px; padding: 10px 10px 11px; border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); }
  .status b { font-size: 13.5px; font-weight: 600; }
  .updated { color: var(--muted); font-size: 12px; }
  .side-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-label { margin: 16px 10px 6px; font: 500 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  nav button { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 5px 10px;
    border: 0; border-radius: 5px; background: transparent; font: inherit; color: var(--ink-2); text-align: left; cursor: pointer; }
  nav button:hover { color: var(--ink); background: var(--sunken); }
  nav button:focus-visible, .menu-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  nav button[aria-selected="true"] { color: var(--ink); font-weight: 600; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  nav button[aria-selected="true"]::before { content: ""; position: absolute; left: -14px; top: 7px; bottom: 7px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--blue); }
  .tab-count { margin-left: auto; color: var(--muted); font: 400 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
  .tab-count.urgent { color: var(--red); font-weight: 600; }
  /* A group of pages folds to its label (with the number of pages in it); the page you are on stays listed */
  .nav-group { display: flex; flex-direction: column; gap: 1px; }
  nav button.nav-label { gap: 6px; min-height: 28px; margin: 12px 0 2px; padding: 4px 10px; font: 500 12px/1.4 var(--mono);
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .nav-group.folded > button[role="tab"]:not([aria-selected="true"]) { display: none; }
  .chev { flex: none; }
  [aria-expanded="false"] > .chev { transform: rotate(-90deg); }
  .side-foot { margin-top: auto; padding-top: 14px; }
  .help-btn { width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); font: 500 13px/1.3 var(--sans); color: var(--ink); cursor: pointer; }
  .help-btn:hover { border-color: var(--ink-2); }
  .help-btn + .help-btn { margin-top: 6px; }
  .menu-btn { display: none; }
  .scrim { position: fixed; inset: 0; z-index: 3; background: rgba(27, 26, 23, .38); }
  main { min-width: 0; max-width: 1180px; padding: 40px 40px 64px; }

  /* Type */
  h2, h3, h4, .next .title, .module .big { text-wrap: balance; }
  h2 { margin: 0 0 14px; font: 400 30px/1.1 var(--serif); letter-spacing: -.01em; }
  h3 { margin: 0 0 12px; padding-bottom: 9px; border-bottom: 1px solid var(--ink); font: 600 14px/1.4 var(--sans); }
  h3 .hint { font-weight: 400; }
  h4 { font: 600 14.5px/1.4 var(--sans); }
  a { color: var(--blue); text-underline-offset: 2px; }
  .hint { color: var(--muted); font-size: 13px; }
  .hint code { padding: 1px 5px; border-radius: 4px; background: var(--sunken); font: 12px/1.4 var(--mono); }
  code.feed { padding: 8px 10px; border-radius: 6px; background: var(--sunken); font: 13px/1.4 var(--mono); word-break: break-all; }
  details summary { margin-top: 8px; color: var(--blue); font-weight: 500; cursor: pointer; }
  pre.text { margin: 8px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    font: inherit; white-space: pre-wrap; }
  .empty { padding: 18px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); text-align: center; }
/* Readers: the bar from today's number to the project's own target */
.meter { height: 6px; margin: 10px 0 8px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--ink); }

  /* Page head: the group (or today's date), the page name, one line on what the page shows */
  .page-head { margin: 0 0 28px; }
  .page-head .eyebrow { margin: 0 0 10px; font: 500 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
  .page-head h2 { margin: 0; font-size: 44px; line-height: 1.02; letter-spacing: -.015em; }
  .page-head p { margin: 10px 0 0; max-width: 68ch; color: var(--ink-2); font-size: 14.5px; text-wrap: pretty; }

  /* Blocks: a block is a heading with an ink rule and what belongs to it; no boxes */
  .card { margin: 0 0 36px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 32px 40px; margin-bottom: 36px; }
  .two > .card { margin-bottom: 0; }
  .wide { grid-column: 1 / -1; }
  .module h3 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .module h3 .btn { min-height: 28px; padding: 2px 10px; font-size: 12.5px; }
  .module .big { margin: 2px 0 6px; font: 400 30px/1.12 var(--serif); letter-spacing: -.01em; }
  /* TradeBot's own page keeps its own (dark) look inside a frame; the frame is as tall as the page says it is */
  .tradebot-page iframe { display: block; width: 100%; max-width: 640px; height: 640px; margin-top: 12px; border: 0; border-radius: 12px; background: #0f1115; }

  /* Numbers sit in one joined strip: hairlines between the cells, no boxes */
  .grid { --cols: 4; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 0 24px; margin: 0 0 36px;
    overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  /* The column count follows the number of cells, so no row ends in a hole: up to four in one row, five and six
     in rows of three, seven and eight in rows of four. With five or seven the first cell is double width. */
  .grid:has(> .kpi:nth-child(1 of .kpi):nth-last-child(1 of .kpi)) { --cols: 1; }
  .grid:has(> .kpi:nth-child(1 of .kpi):nth-last-child(2 of .kpi)) { --cols: 2; }
  .grid:has(> .kpi:nth-child(1 of .kpi):nth-last-child(3 of .kpi)),
  .grid:has(> .kpi:nth-child(1 of .kpi):nth-last-child(5 of .kpi)),
  .grid:has(> .kpi:nth-child(1 of .kpi):nth-last-child(6 of .kpi)) { --cols: 3; }
  .grid > .kpi:nth-child(1 of .kpi):nth-last-child(5 of .kpi),
  .grid > .kpi:nth-child(1 of .kpi):nth-last-child(7 of .kpi) { grid-column: span 2; }
  .grid > .card { position: relative; margin: -1px 0 0; padding: 17px 0 18px; }
  /* The rule above each row runs through the column gap, so a row reads as one line, not as dashes */
  .grid > .card::after { content: ""; position: absolute; left: -24px; right: 0; top: 0; height: 1px; background: var(--line); }
  .grid > .card::before, .runs li::before { content: ""; position: absolute; left: -12px; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .kpi .label { font: 500 12px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .kpi .value { margin-top: 6px; font: 400 38px/1 var(--serif); letter-spacing: -.01em; }
  .kpi .value.long { margin-top: 8px; font-size: 23px; line-height: 1.2; }
  .kpi .note { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  .next .when { font: 500 12px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--blue); }
  .next .title { margin: 6px 0 4px; font: 400 30px/1.1 var(--serif); letter-spacing: -.01em; }

  /* Scheduled automations: the same joined strip, one cell per task */
  .runs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 24px; margin: -12px 0 0; padding: 0;
    list-style: none; overflow: hidden; border-bottom: 1px solid var(--line); }
  .runs li { position: relative; margin: -1px 0 0; padding: 11px 0 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .runs b { font-weight: 600; }
  .runs .when { display: block; margin-top: 2px; font: 12px/1.5 var(--mono); color: var(--muted); }
  .runs li.bad .when { color: var(--red); }

  /* Badges and buttons */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font: 500 12px/1.5 var(--mono); background: var(--blue-soft); color: var(--blue); }
  .badge.good { background: var(--green-soft); color: var(--green); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .badge.bad { background: var(--red-soft); color: var(--red); }
  .badge.grey { background: var(--sunken); color: var(--ink-2); }
  .note-badge { display: block; width: fit-content; max-width: 100%; margin-top: 4px; white-space: normal; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 14px;
    border: 1px solid var(--blue); border-radius: 6px; background: var(--blue); color: #fff; font: inherit; font-weight: 500;
    text-decoration: none; white-space: nowrap; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .btn.ghost:hover { border-color: var(--ink-2); filter: none; }
  .btn:focus-visible, .help-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* One button for a whole list, with one line on what it does */
  .actions.bulk { align-items: center; gap: 8px 14px; margin: 0 0 6px; }
  .actions.bulk .hint { flex: 1 1 280px; }

  /* To-do rows: the text on the left, its buttons in a fixed column on the right */
  .todo { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 8px 24px; align-items: start; padding: 14px 0;
    border-top: 1px solid var(--line); }
  h3 + .todo { border-top: 0; }
  .todo.p1 { padding-left: 14px; box-shadow: inset 3px 0 0 var(--red); }
  .todo .text { min-width: 0; overflow-wrap: anywhere; }
  .todo h4 { display: inline; margin: 0 0 0 6px; font-size: 15px; }
  .todo h4:first-child { margin-left: 0; }
  .todo .hint { margin-top: 3px; max-width: 80ch; }
  .todo ul { margin: 6px 0 0; padding-left: 18px; }
  .todo li { margin: 2px 0; }
  .todo .actions { flex-direction: column; align-items: stretch; gap: 6px; margin: 0; }
  .todo .actions .btn { width: 100%; }
  .todo + .btn { margin-top: 12px; }
  /* A mail that can be answered: its answers sit beside it, an answered mail is one quiet line, a note is typed
     in a field that opens under the mail */
  .todo.answered { padding: 8px 0; }
.todo.mail { grid-template-columns: minmax(0, 1fr) 230px; padding: 12px 0; }
.todo.mail.p1 { padding-left: 14px; }
.todo.mail .actions { flex-direction: row; flex-wrap: wrap; }
.todo.mail .actions .btn { flex: 1 1 0; width: auto; padding-left: 8px; padding-right: 8px; white-space: nowrap; }
.todo.mail .actions a { flex: 1 0 100%; }
.mail-group { margin: 16px 0 2px; }
.btn.small { min-height: 28px; margin-left: 8px; padding: 2px 10px; font-size: 13px; }
  .todo.answered h4 { color: var(--muted); font-weight: 500; }
.todo.answered .actions { align-items: flex-end; }
.todo.answered .actions .btn { width: auto; }
  .todo li .btn { min-height: 28px; margin: 2px 0 2px 6px; padding: 2px 10px; font-size: 13px; }
.todo li .answers { display: inline-block; white-space: nowrap; }
  .note-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .note-form input { flex: 1 1 260px; min-height: 34px; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong);
    border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; }
  .note-form input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* Upcoming posts, and the creator e-mails waiting to go out */
  .post, .mail { padding: 16px 0; border-top: 1px solid var(--line); }
  h3 + .mail { padding-top: 4px; border-top: 0; }
  .mail-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .mail-head .actions { margin-top: 0; }
  .mail .subject { margin-top: 10px; font-weight: 600; }
  /* An error message as the system gave it: wraps anywhere, so a long URL cannot widen the page */
  .problem { margin-top: 8px; padding: 6px 10px; border-radius: 4px; background: var(--red-soft); color: var(--red);
    font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }
  /* A comment or message that waits for an answer (replies.py) */
  .reply { padding: 12px 0; border-top: 1px solid var(--line); }
  .reply .said { margin: 4px 0 6px; overflow-wrap: anywhere; }
  .post .head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .post .when { font-weight: 600; }
  .post .num { display: inline-block; min-width: 26px; margin-right: 8px; border-radius: 4px; background: var(--ink); color: #fff;
    font: 500 12px/1.6 var(--mono); text-align: center; }
  .post h4 { margin: 6px 0 0; font-size: 16px; }
  .post .hook { color: var(--ink-2); margin: 2px 0 8px; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; align-items: flex-start; }
  .thumbs video.reel { width: 152px; height: 190px; }
  .thumbs img, .thumbs video { flex: none; width: 170px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--sunken); }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  .scroll { overflow-x: auto;
    background:
      linear-gradient(to right, var(--bg) 30%, rgba(255,255,255,0)) left / 32px 100% no-repeat local,
      linear-gradient(to left, var(--bg) 30%, rgba(255,255,255,0)) right / 32px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.16), transparent) left / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.16), transparent) right / 12px 100% no-repeat scroll; }
  .scroll:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .scroll table { min-width: 720px; }
  .two .scroll table { min-width: 440px; }
  td.state { width: 1%; white-space: nowrap; }
  .scroll td:first-child { white-space: nowrap; }
  .scroll td b { white-space: nowrap; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { border-bottom-color: var(--line-strong); color: var(--muted); font: 500 12px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.num:first-child, th.num:first-child { text-align: left; }
  td.zero b { color: var(--muted); font-weight: 600; }
  tr.quiet td { color: var(--muted); }
  tr.quiet td a { color: var(--muted); }

  /* Charts, rankings, the log */
  svg.chart { width: 100%; height: auto; }
  svg.chart .axis { stroke: var(--line); }
  svg.chart .line { fill: none; stroke: var(--blue); stroke-width: 2; }
  svg.chart .dot { fill: var(--blue); }
  svg.chart text { fill: var(--muted); font-size: 12px; }
  .spark rect.on { fill: var(--blue); }
  .spark rect.off { fill: currentColor; opacity: .15; }
  .rank { display: grid; grid-template-columns: 150px 1fr 60px; gap: 8px; align-items: center; padding: 4px 0; }
  .rank .track { height: 8px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
  .rank .fill { background: var(--blue); height: 100%; }
  .log { margin: 0; max-height: 70vh; overflow: auto; font: 12px/1.6 var(--mono); white-space: pre-wrap; }
  .log .t { color: var(--muted); }
  .log .w { color: var(--amber); }
  .log .e { color: var(--red); }

  /* Launch tests and automations */
  .launch-links { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 4px; }
  .launch-links + .hint, td .badge + .hint { white-space: nowrap; }
  td .badge + .hint.step-detail { white-space: normal; overflow-wrap: anywhere; }

  /* Patent screen: long text cells wrap, and each project becomes a stacked block on a phone. */
  .patents .scroll td:first-child, .patents td .badge + .hint { white-space: normal; }
  .patents .scroll td:first-child { min-width: 220px; }
  .patents table.candidates th:nth-child(1) { width: 32%; }
  .patents table.candidates th:nth-child(2) { width: 17%; }
  .patents table.candidates th:nth-child(3) { width: 23%; }
  .patents table.candidates th:nth-child(4) { width: 28%; }
  .patents tr.project td { border-bottom: 0; padding-bottom: 2px; }
  .patents tr.why-row td { padding-top: 0; }
  .patents details > summary { margin-top: 0; padding: 6px 0; }
  .patents td .badge { white-space: normal; }
  .patents td.screen b { display: block; font: 400 22px/1.2 var(--serif); }
  .patents td .hint { margin-top: 4px; max-width: 46ch; }
  .patents ul.plain { margin: 6px 0; padding-left: 18px; }
  .patents .why ul { margin: 8px 0; padding-left: 18px; }
  .patents .why li { margin-bottom: 8px; max-width: 80ch; }
  .patents .why li b { white-space: normal; }
  .patents .why q { display: block; color: var(--muted); font-size: 13px; quotes: "\201C" "\201D"; }
  .patents .why .hint { max-width: 80ch; }
  .patents .why .actions { margin-top: 10px; }
  /* Patent desk: same table rules; five columns, a checklist and a small filing form per project. */
  .patents table.desk th:nth-child(1) { width: 22%; }
  .patents table.desk th:nth-child(2) { width: 17%; }
  .patents table.desk th:nth-child(3) { width: 13%; }
  .patents table.desk th:nth-child(4) { width: 30%; }
  .patents table.desk th:nth-child(5) { width: 18%; }
  .patents td.ready b { display: block; font: 400 22px/1.2 var(--serif); }
  .patents ul.checks { list-style: none; margin: 8px 0; padding: 0; max-width: 80ch; }
  .patents ul.checks li { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; margin-bottom: 8px; }
  .patents ul.checks .hint { grid-column: 2; margin: 0; }
  .patents .filing { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin-top: 10px; }
  .patents .filing label { display: grid; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .patents .filing input { min-height: 38px; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink); font: inherit; }
  .patents .filing input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* Per day, every automation */
  table.daily td.n, table.daily th.n { text-align: right; white-space: nowrap; }
  table.daily tr.group-start td { border-top: 1px solid rgba(127,127,127,.25); }
  table.daily td { vertical-align: middle; }
  table.daily .repeat, table.daily .ph { display: none; }
  table.daily a.goto { cursor: pointer; color: var(--ink); }

  /* Toast and the help dialog */
  .toast { position: fixed; right: 18px; bottom: 18px; z-index: 5; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 380px; }
  dialog.help { width: calc(100% - 32px); max-width: 720px; padding: 0; border: 0; border-radius: 10px; background: var(--bg); color: var(--ink);
    box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog.help::backdrop { background: rgba(0,0,0,.35); }
  dialog.help .inner { padding: 20px 22px; max-height: 80vh; overflow: auto; }
  dialog.help .mod { border-top: 1px solid var(--line); padding: 12px 0; }
  dialog.help .mod h3 { margin: 0 0 4px; padding: 0; border: 0; }
  dialog.help dt { margin-top: 6px; color: var(--muted); font: 500 12px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  dialog.help dd { margin: 0; }

  /* Folding and arranging. A block folds to its heading; "Arrange" turns a page into a list of its blocks with
     Up and Down. Both are remembered in this browser (design.md: Layout). */
  .page-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tool { min-height: 28px; padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: transparent;
    color: var(--ink-2); font: 500 12px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
  .tool:hover { border-color: var(--ink-2); color: var(--ink); }
  .tool[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool:focus-visible, .fold:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .foldable > h3 { position: relative; padding-left: 24px; cursor: pointer; }
  .fold { position: absolute; left: -4px; top: -2px; display: inline-flex; align-items: center; justify-content: center; width: 24px;
    height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; }
  .fold::after { content: ""; position: absolute; inset: -10px; }
  .fold:hover { background: var(--sunken); color: var(--ink); }
  .card.folded { margin-bottom: 20px; }
  .card.folded > h3 { margin-bottom: 0; }
  .card.folded > :not(h3):not(.arrange-bar) { display: none; }
  .arrange-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px;
    border: 1px dashed var(--line-strong); border-radius: 6px; }
  .arrange-bar .name { flex: 1; min-width: 0; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .arranging .unit { display: block; margin: 0 0 8px; padding: 0; border: 0; }
  .arranging .unit:not(.two) > :not(.arrange-bar) { display: none; }
  .arranging .two > .arrange-bar { margin-bottom: 8px; }
  .arranging .two > .unit { margin-left: 24px; }

  /* Tablet and phone: the sidebar becomes a top bar with a menu button that opens the pages as a drawer */
  @media (max-width: 900px) {
    .app { display: block; }
    .side { position: sticky; z-index: 2; height: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .side-head { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; }
    .menu-btn { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border: 0;
      border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
    .brand { padding: 0; font-size: 22px; }
    .status { margin-left: auto; padding: 0; border: 0; text-align: right; }
    .status b { display: none; }
    .side-body { position: fixed; z-index: 4; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); padding: 8px 14px 16px;
      border-right: 1px solid var(--line); background: var(--bg); overflow-y: auto; visibility: hidden; transform: translateX(-100%); }
    /* The open drawer has to sit above the scrim (z-index 3), and .side is its stacking context */
    .side.open { z-index: 4; }
    .side.open .side-body { visibility: visible; transform: none; }
    nav button, nav button.nav-label, .tool { min-height: 44px; }
    .help-btn { min-height: 44px; }
    main { padding: 28px 24px 56px; }
  }
  /* Phone: 44px targets, two-column number strips, tables that stack */
  @media (max-width: 760px) {
    main { padding: 20px 16px 48px; }
    .page-head { margin-bottom: 20px; }
    .page-head h2 { font-size: 34px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > .kpi:nth-child(1 of .kpi):nth-last-child(odd of .kpi) { grid-column: span 2; }
    .kpi .value { font-size: 32px; }
    .kpi .value.long { font-size: 20px; }
    .btn { min-height: 44px; padding: 10px 16px; white-space: normal; }
    .module h3 .btn { min-height: 44px; padding: 8px 14px; }
    .todo { display: block; }
    .todo .actions { flex-direction: row; flex-wrap: wrap; margin-top: 10px; }
    .todo .actions .btn { width: auto; }
    .todo li .btn, .btn.small, .note-form input { min-height: 44px; }
    td a, .todo li a, .launch-links a, details summary { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; }
    .patents .filing input { min-height: 44px; }
    .patents td.ready b, .patents td.screen b { display: inline; margin-right: 8px; }
    .patents .scroll table { min-width: 0; }
    .patents .scroll thead { display: none; }
    .patents .scroll table, .patents .scroll tbody, .patents .scroll tr, .patents .scroll td { display: block; width: 100%; }
    .patents .scroll tr { padding: 12px 0; border-top: 1px solid var(--line); }
    .patents .scroll tr:first-child { border-top: 0; }
    .patents .scroll tr.project { padding-bottom: 0; }
    .patents .scroll tr.why-row { border-top: 0; padding: 0 0 8px; }
    .patents .scroll td { padding: 4px 0; border: 0; text-align: left; }
    .patents .scroll td:first-child { min-width: 0; }
    .patents .scroll td[data-label]::before { content: attr(data-label); display: block; color: var(--muted);
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    /* A table whose rows are instructions, not figures, reads as one block per row on a phone */
    .scroll table.stack { min-width: 0; }
    table.stack thead { display: none; }
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
    table.stack tr { padding: 12px 0; border-top: 1px solid var(--line); }
    table.stack tr:first-child { border-top: 0; }
    .scroll table.stack td { padding: 3px 0; border: 0; text-align: left; white-space: normal; }
  }
  @media (max-width: 600px) {
    table.daily thead { display: none; }
    .scroll table.daily { min-width: 0; }
    table.daily, table.daily tbody, table.daily tr { display: block; width: 100%; }
    table.daily tr { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; padding: 12px 0;
      border-top: 1px solid var(--line); }
    table.daily tr:first-child { border-top: 0; }
    table.daily tr.group-start td { border-top: 0; }
    table.daily td { display: block; padding: 0; border: 0; text-align: left; }
    table.daily td.mod, table.daily td.what, table.daily td.sp { grid-column: 1 / -1; }
    table.daily tr:not(.group-start) { border-top: 0; padding-top: 4px; }
    table.daily td.what { margin-bottom: 4px; color: var(--ink); font-weight: 600; }
    table.daily td[data-label]::before { content: attr(data-label) " "; color: var(--muted); font-weight: 400; }
    table.daily td.n, table.daily td.hint { white-space: normal; text-align: left; }
    table.daily td.sp { margin-top: 6px; }
    table.daily .dk { display: none; }
    table.daily .ph { display: inline; }
  }
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="side-head">
    <button type="button" class="menu-btn" id="nav-menu" aria-expanded="false" aria-controls="side-body" aria-label="Pages">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
    <h1 class="brand"><img class="logo" src="/icon.svg" alt="" width="26" height="26">ReachPilot</h1>
    <div class="status"><b>This PC</b><span class="updated" id="updated">Loading…</span></div>
  </div>
  <div class="side-body" id="side-body">
    <nav role="tablist" id="tabs" aria-orientation="vertical" aria-label="Pages">
      <div class="nav-label" role="presentation">Today</div>
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="todo">To do<span class="tab-count" id="todo-count" hidden></span></button>
      <div class="nav-group folded" data-group="posting" role="presentation">
        <button type="button" class="nav-label" aria-expanded="false">Posting<span class="tab-count group-count"></span><svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button role="tab" data-tab="linkedin">LinkedIn</button>
        <button role="tab" data-tab="schedule">Schedule</button>
        <button role="tab" data-tab="reach">Reach</button>
        <button role="tab" data-tab="learning">Learning</button>
      </div>
      <div class="nav-group folded" data-group="projects" role="presentation">
        <button type="button" class="nav-label" aria-expanded="false">Projects<span class="tab-count group-count"></span><svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button role="tab" data-tab="github">GitHub</button>

        <button type="button" class="nav-label" aria-expanded="false">Job search<span class="tab-count group-count"></span><svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button role="tab" data-tab="jobs">Jobs</button>

<dialog class="help" id="help"><div class="inner" id="help-body"></div></dialog>

<script>
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Escapes text, then turns every http(s) URL in it into its own link (details can hold several, comma-separated).
const linkify = (value) => esc(value).replace(/https?:\/\/[^\s,<]+?(?=&quot;|&#39;|[\s,<]|$)/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const num = (value) => (value === null || value === undefined ? "–" : Number(value).toLocaleString("en-US"));
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function niceDate(stamp) {
  if (!stamp) return "–";
  const [date, time] = stamp.split(" ");
  const [y, m, d] = date.split("-").map(Number);
  const day = new Date(y, m - 1, d);
  return `${DAYS[day.getDay()]} ${d} ${MONTHS[m - 1]}` + (time ? ` · ${time}` : "");
}

const KIND = {
  prepared: ["Prepared post", ""],
  event: ["New on GitHub", "good"],
  drafted: ["Drafted", "warn"],
  auto: ["Picked on the day", "grey"],
  cap: ["Weekly limit", "grey"],
};
const STATUS = { posted: "good", ready: "warn", awaiting_approval: "warn", failed: "bad", skipped: "grey" };

function lineChart(series, emptyText) {
  if (!series.length) return `<div class="empty">${esc(emptyText)}</div>`;
  const W = 520, H = 170, L = 36, R = 14, T = 14, B = 26;
  const max = Math.max(1, ...series.map((p) => p.y));
  const x = (i) => L + (series.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (series.length - 1));
  const y = (v) => H - B - (v * (H - T - B)) / max;
  const points = series.map((p, i) => `${x(i)},${y(p.y)}`).join(" ");
  const dots = series.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="3.5"><title>${esc(p.x)}: ${num(p.y)}</title></circle>`).join("");
  const first = series[0].x, last = series[series.length - 1].x;
  const summary = `Line chart from ${niceDate(first)} to ${niceDate(last)}, highest value ${num(max)}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}">
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    <line class="axis" x1="${L}" y1="${T}" x2="${W - R}" y2="${T}" stroke-dasharray="3 4"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${num(max)}</text>
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">0</text>
    ${series.length > 1 ? `<polyline class="line" points="${points}"/>` : ""}${dots}
    <text x="${L}" y="${H - 6}">${esc(niceDate(first))}</text>
    ${series.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(niceDate(last))}</text>` : ""}
  </svg>`;
}

function spark(series) {
  if (!series || !series.length) return "";
  const W = 120, H = 28, max = Math.max(1, ...series.map((p) => p.y));
  const step = W / series.length;
  const bars = series.map((p, i) => {
    const h = p.y ? Math.max(2, (p.y * (H - 2)) / max) : 1;
    return `<rect x="${(i * step + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(step - 2).toFixed(1)}" height="${h.toFixed(1)}" class="${p.y ? "on" : "off"}"><title>${esc(p.x)}: ${num(p.y)}</title></rect>`;
  }).join("");
  const label = `Last ${series.length} days: ${series.map((p) => num(p.y)).join(", ")}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">${bars}</svg>`;
}

function dailyTable(rows) {
  if (!rows || !rows.length) return `<div class="empty">No numbers yet. Each automation adds a row after its first run.</div>`;
  let lastModule = "";
  const body = rows.map((r) => {
    const first = r.module !== lastModule;
    lastModule = r.module;
    const avgNote = r.avg_days && r.avg_days < 7 ? ` <span class="hint">(${r.avg_days} d)</span>` : "";
    const atLimit = r.limit && r.today >= r.limit ? ` <span class="badge warn">at limit</span>` : "";
    const limitText = r.limit_label || "";
    const phoneLimit = /^\d/.test(limitText) ? `Limit ${limitText}` : limitText.charAt(0).toUpperCase() + limitText.slice(1);
    return `<tr${first ? ' class="group-start"' : ""}>
      <td class="mod">${first ? `<a class="goto" data-goto="${esc(r.tab)}"><b>${esc(r.module)}</b></a>` : `<span class="repeat">${esc(r.module)}</span>`}</td>
      <td class="what" title="${esc(r.note || "")}">${esc(r.label)}</td>
      <td class="n${r.today ? "" : " zero"}" data-label="Today"><b>${num(r.today)}</b>${atLimit}</td>
      <td class="n" data-label="Avg / day">${num(r.avg7)}${avgNote}</td>
      <td class="n" data-label="Best day">${num(r.best)}</td>
      <td class="hint"><span class="dk">${esc(limitText)}</span><span class="ph">${esc(phoneLimit)}</span></td>
      <td class="sp">${spark(r.series)}</td>
    </tr>`;
  }).join("");
  return `<div class="scroll"><table class="daily">
    <thead><tr><th>Automation</th><th>Per day</th><th class="n">Today</th><th class="n">Avg / day</th><th class="n">Best day</th><th>Daily limit</th><th>Last 14 days</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

// The top of every page: the group it belongs to (or today's date), its name, and one line on what it shows.
function pageHead(eyebrow, title, lead = "") {
  return `<header class="page-head"><p class="eyebrow">${esc(eyebrow)}</p><h2>${esc(title)}</h2>${lead ? `<p>${lead}</p>` : ""}</header>`;
}

// Pages that belong to an optional module only show in the sidebar where that module is installed.
function moduleTab(id, shown) {
  const button = document.querySelector(`nav button[data-tab="${id}"]`);
  if (button) button.hidden = !shown;
}

function kpi(label, value, note = "") {
  const plain = String(value).replace(/<[^>]*>/g, "");
  const size = plain.length > 9 ? " long" : "";
  return `<div class="card kpi"><div class="label">${esc(label)}</div><div class="value${size}">${value}</div><div class="note">${note}</div></div>`;
}

const REEL_FORMATS = { hook: "hook", pov: "POV", question: "question", listicle: "3 things", speedrun: "speedrun", film: "product film", roundup: "roundup" };

function postCard(entry, index) {
  const [kindLabel, kindClass] = KIND[entry.kind] || [entry.kind, ""];
  const reel = entry.images.map((src) => /_demo_([a-z]+)_(feed|tall)\.mp4$/i.exec(src)).find(Boolean);
  const reelLabel = reel ? REEL_FORMATS[reel[1]] || reel[1] : "";
  const thumbs = entry.images.length ? `<div class="thumbs">${entry.images.map((src) => /\.mp4$/i.test(src)
    ? `<video src="${esc(src)}" muted controls preload="metadata" ${reel ? `class="reel" title="Short video: ${esc(reelLabel)}"` : `title="Demo video"`}></video>`
    : `<img src="${esc(src)}" alt="" loading="lazy">`).join("")}</div>` : "";
  const full = entry.body
    ? `<details><summary>Full post text</summary><pre class="text">${esc(entry.body)}</pre>${entry.comment ? `<div class="hint" style="margin-top:8px"><b>First comment</b></div><pre class="text">${esc(entry.comment)}</pre>` : ""}</details>`
    : "";
  return `<article class="post ${esc(entry.kind)}">
    <div class="head">
      <div class="when"><span class="num">${index + 1}</span>${esc(niceDate(entry.slot))} WIB</div>
      <div><span class="badge ${kindClass}">${esc(kindLabel)}</span> ${entry.angle && entry.angle !== "auto" && entry.angle !== "-" ? `<span class="badge grey">${esc(entry.angle)}</span>` : ""}${reel ? ` <span class="badge grey">video: ${esc(reelLabel)}</span>` : ""}</div>
    </div>
    <h4>${esc(entry.title)}</h4>
    <p class="hook">${esc(entry.hook)}</p>
    ${thumbs}${full}
  </article>`;
}

function renderLinkedin(d) {
  const o = d.overview;
  const next = o.next_post;
  const tokenNote = o.token_days_left === null ? "Not connected: python autopilot.py auth" : o.token_days_left < 7 ? "Renew soon: python autopilot.py auth" : "Connected";
  const tokenBadge = o.token_days_left === null ? "bad" : o.token_days_left < 7 ? "warn" : "good";
  const state = o.paused ? `<span class="badge warn">Paused</span>` : `<span class="badge good">Running</span>`;
  document.getElementById("linkedin").innerHTML = `
    ${pageHead("Posting", "LinkedIn", `${num(o.posts_this_week)} of ${num(o.max_per_week)} posts this week. Slots: ${esc(o.slots.join(", "))} WIB.`)}
    <div class="grid">
      <div class="card next wide">
        ${next ? `<div class="when">Next post · ${esc(niceDate(next.slot))} WIB</div>
          <div class="title">${esc(next.title)}</div>
          <div class="hint">${esc(next.hook)}</div>` : `<div class="hint">Nothing scheduled.</div>`}
      </div>
      ${kpi("Status", state, `Mode: ${esc(o.mode)} · last run ${esc(o.last_tick ? niceDate(o.last_tick) : "–")}`)}
      ${kpi("This week", `${o.posts_this_week} / ${o.max_per_week}`, `Slots: ${esc(o.slots.join(", "))} WIB`)}
      ${kpi("Posted", num(o.posted_total), o.failed_total ? `<span class="badge bad">${o.failed_total} failed</span>` : "All good")}
      ${kpi("Prepared posts left", num(o.prepared_left), "Then the bot writes them itself")}
      ${kpi("LinkedIn login", o.token_days_left === null ? "–" : `${o.token_days_left} days`, `<span class="badge ${tokenBadge}">${esc(tokenNote)}</span>`)}
      ${kpi("Click tracking", o.click_tracking ? "On" : "Off", o.click_tracking ? "GoatCounter counts “Try it” clicks" : "Run: python autopilot.py goatcounter")}
    </div>
    <div class="two">
      <div class="card"><h3>GitHub stars (all projects)</h3>${lineChart(d.github.stars_series, "Collected daily from tomorrow on.")}</div>
      <div class="card"><h3>“Try it” clicks per day</h3>${lineChart(d.github.clicks_series, "No clicks yet. They start once posts go out.")}</div>
    </div>`;
}

function renderSchedule(d) {

const TOKEN = "__RP_TOKEN__";
let latest = null;

function toast(message) {
  const box = document.getElementById("toast");
  box.textContent = message;
  box.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (box.hidden = true), 4500);
}

async function act(name, button) {
  const label = button ? button.textContent : "";
  if (button) {
    button.disabled = true;
    button.textContent = "Working…";
  }
  try {
    const response = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-ReachPilot-Token": TOKEN },
      body: JSON.stringify({ name }),
    });
    const reply = await response.json().catch(() => ({ message: "Done." }));
    toast(reply.message || (response.ok ? "Done." : "That didn't work."));
    // data-now: the action has already written its result (an answer on the inbox card), nothing runs in the background
    setTimeout(load, button && "now" in button.dataset ? 0 : 1500);
  } catch (error) {
    toast("Couldn't reach ReachPilot: " + error.message);
  } finally {
    if (button) {
      setTimeout(() => {
        button.disabled = false;
        button.textContent = label;
      }, 1500);
    }
  }
}

// On the phone the page sits in a frame where the browser's own confirm() and prompt() never open. The phone
// snapshot (phone_snapshot.py) brings rpConfirm and rpPrompt, which answer a moment later; the PC keeps the browser's.
const askYes = async (text) => (window.rpConfirm ? window.rpConfirm(text) : confirm(text));
const askText = async (text, words = false) => (window.rpPrompt ? window.rpPrompt(text, words) : prompt(text));

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  // data-confirm: a button that cannot be taken back (Send all now) asks once before it runs
  if (button && !button.dataset.confirm) act(button.dataset.action, button);
  else if (button) askYes(button.dataset.confirm).then((yes) => yes && act(button.dataset.action, button));
  const ask = event.target.closest("[data-ask]");
  if (ask) {
    askText(ask.dataset.question).then((typed) => {
      const answer = (typed || "").trim();
      if (/^https:\/\/\S+$/.test(answer)) act(ask.dataset.ask + answer, ask);
      else if (answer) toast("That needs a link that starts with https://");
    });
  }
  // data-say: my own answer to a comment or message (replies.py). The words travel in the button's name.
  const say = event.target.closest("[data-say]");
  if (say) {
    askText(say.dataset.question, true).then((typed) => {
      const answer = (typed || "").replace(/\s+/g, " ").trim();
      const most = Number(say.dataset.most) || 500;
      if (answer.length > most) toast(`That has ${answer.length} characters; ${most} is the most here. Nothing was sent.`);
      else if (answer) act(say.dataset.say + answer, say);
    });
  }
  const filed = event.target.closest("[data-filed]");
  if (filed) {
    const form = filed.closest(".filing");
    const day = form.querySelector("input[type=date]").value;
    const number = form.querySelector("input[type=text]").value.trim().replace(/\s+/g, " ");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) toast("Pick the date the application was filed.");
    else if (!/^[0-9\/, ]{6,14}$/.test(number) || !/\d/.test(number)) toast("The application number looks like 63/123,456.");
    else {
      form.querySelectorAll("input").forEach((input) => { input.value = ""; });
      act(`patents:filed:${filed.dataset.filed}:${day}:${number}`, filed);
    }
  }
  const note = event.target.closest("[data-inbox-note]");
  if (note) {
    const field = note.closest(".note-form").querySelector("input");
    field.blur();  // the page is not redrawn under a field that has the keyboard
    note.closest("details").open = false;
    act(`inbox:note:${note.dataset.inboxNote}|${field.value.replace(/\s+/g, " ").trim()}`, note);
  }
  const jump = event.target.closest("[data-goto]");
  if (jump) {
    showTab(jump.dataset.goto);
    window.scrollTo(0, 0);
  }
  const copy = event.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy)
      .then(() => toast("Feed address copied. Paste it on the directory's page."))
      .catch(() => toast("Copy didn't work here; select the address and copy it by hand."));
  }
  const done = event.target.closest("[data-done]");
  if (done) {
    const keys = dismissed();
    keys.push(done.dataset.done);
    try {
      localStorage.setItem("rp-done", JSON.stringify(keys.slice(-50)));
    } catch (error) {}
    toast("Marked done. It comes back if anything about it changes.");
    if (latest) {
      renderOverview(latest);
      renderTodo(latest);
      renderPatents(latest);
    }
  }
});

function actionButton(name, label, ghost = false, ask = "") {
  return name ? `<button class="btn ${ghost ? "ghost" : ""}" data-action="${esc(name)}"${ask ? ` data-confirm="${esc(ask)}"` : ""}>${esc(label)}</button>` : "";
}

function coveredButton(creator) {
  return `<button class="btn ghost" data-ask="${esc(`promote:covered:${creator.id}|`)}" data-question="${esc(`Link to ${creator.name}'s video or post about it (https://...)`)}">They covered it</button>`;
}

function link(url, label) {
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
}

const MODULE_TAB = { jobs: "jobs", "job search": "jobs", "e-mail": "email", email: "email", linkedin: "linkedin", promote: "promote", "creator outreach": "promote", podcast: "podcast", patents: "patents", launch: "launch", tradebot: "tradebot", replies: "reach" };

function todoKey(item) {
  return `${item.module}|${item.title}|${item.detail}`;
}

function dismissed() {
  try {
    return JSON.parse(localStorage.getItem("rp-done") || "[]");
  } catch (error) {
    return [];
  }
}

function openTodos(items) {
  const done = dismissed();
  return items
    .filter((item) => item.links.some((l) => l.actions) || !done.includes(todoKey(item)))
    .map((item, index) => [item, index])
    .sort((a, b) => a[0].priority - b[0].priority || a[1] - b[1])
    .map(([item]) => item);
}

function todoCard(item, compact = false) {
  // Overview (compact) is a summary: the first four links with a short note. The To do page shows all of it.
  // Something that failed is never cut short: Overview lists every one of them too.
  const shown = compact && !item.failed ? item.links.slice(0, 4) : item.links;
  const short = (note) => (compact && note.length > 90 ? `${note.slice(0, 88).trimEnd()}…` : note);
  const more = item.links.length - shown.length;
  // A link can carry its own answers (a mail of the inbox card). They are kept on the PC, so such a row has no
  // "Mark done" of its own: it leaves To do when its last mail is answered. Overview only lists; To do answers.
  // An answer with "ask" needs words first (my own reply to a comment): it asks, then sends them with the name.
  const answers = (l) => (compact || !(l.actions || []).length ? "" : `<span class="answers">${l.actions.map((a) => (a.ask
    ? `<button class="btn ghost" data-say="${esc(a.name)}" data-question="${esc(a.ask)}"${a.most ? ` data-most="${Number(a.most)}"` : ""} data-now>${esc(a.label)}</button>`
    : `<button class="btn ghost" data-action="${esc(a.name)}" data-now>${esc(a.label)}</button>`)).join("")}</span>`);
  const answered = item.links.some((l) => l.actions);
  const links = shown.length
    ? `<ul>${shown.map((l) => `<li>${link(l.url, l.label)}${l.note ? ` <span class="hint">· ${esc(short(l.note))}</span>` : ""}${answers(l)}</li>`).join("")}${
      more > 0 ? `<li class="hint">and ${more} more in To do</li>` : ""}</ul>` : "";
  const tab = MODULE_TAB[String(item.module).toLowerCase()];
  const buttons = item.action
    ? actionButton(item.action, item.action_label)
    : `${tab ? `<button class="btn ghost" data-goto="${tab}">Open ${esc(item.module)}</button>` : ""}${
      answered ? "" : `<button class="btn ghost" data-done="${esc(todoKey(item))}">Mark done</button>`}`;
  return `<div class="todo p${item.priority}${compact ? " compact" : ""}">
    <div class="text">
      <span class="badge ${item.priority === 1 ? "bad" : item.priority === 2 ? "warn" : "grey"}">${esc(item.module)}${item.priority === 1 ? " · urgent" : ""}${item.failed ? " · failed" : ""}</span>
      <h4>${esc(item.title)}</h4>
      <div class="hint">${esc(item.detail)}</div>
      ${links}
    </div>
    <div class="actions">${buttons}</div>
  </div>`;
}

function runStrip(tasks) {
  const items = Object.entries(tasks || {}).filter(([, t]) => t.installed);
  if (!items.length) return "";
  const time = (stamp) => (stamp && stamp.includes("·") ? stamp.split("·")[1].trim() : stamp || "–");
  const rows = items.map(([key, t]) => {
    const state = t.ok ? `ran ${esc(time(t.last_run))}` : `last run failed (${esc(t.last_result || "error")})`;
    return `<li class="${t.ok ? "ok" : "bad"}"><b>${esc(t.name)}</b>${t.ok ? "" : ` <span class="badge bad">Failed</span>`}
      <span class="when">${state} · next ${esc(time(t.next_run))}</span></li>`;
  }).join("");
  return `<div class="card"><h3>Scheduled automations</h3><ul class="runs">${rows}</ul></div>`;
}

function launchCards(launch) {
  const tests = (launch && launch.tests) || [];
  const stateBadge = { done: "good", "last-tap": "warn", blocked: "bad", yours: "grey", auto: "good" };
  const cell = (value) => (value === null || value === undefined ? "–" : num(value));
  return tests.map((t) => {
    const whenBadge = t.when ? ` <span class="badge ${t.phase === "final" ? "grey" : ""}">${esc(t.when)}</span>` : "";
    if (!t.available) {
      return `<div class="card">
        <h3>Launch test: ${esc(t.name)}</h3>
        <p class="hint">No answer yet from the project's status file. The next try is in a few minutes.</p>
      </div>`;
    }
    const dates = [
      t.start_text && t.end_text ? `${esc(t.start_text)} to ${esc(t.end_text)}` : "",
      t.decision_day ? `decision ${esc(t.decision_day)}` : "",
      t.updated_text ? `counted ${esc(t.updated_text)}` : "",
    ].filter(Boolean).join(" · ");
    const counts = t.counts.map((c) => `<tr>
        <td>${esc(c.label)}</td>
        <td class="num"><b>${cell(c.have)}</b></td>
        <td class="num">${cell(c.need)}</td>
        <td class="num">${cell(c.stop)}</td>
      </tr>`).join("");
    const linkRow = (links) => `<div class="launch-links">${links.map((l) => link(l.url, l.label)).join("")}</div>`;
    const stepTag = (s) => (s.automation ? ` <span class="badge grey">automatic</span>` : s.private ? ` <span class="badge grey">private</span>` : "");
    const stepButtons = (s) => ((s.actions || []).length
      ? `<div class="launch-links">${s.actions.map((a) => actionButton(a.name, a.label, true)).join("")}</div>` : "");
    const steps = t.needs_me.map((s) => `<tr>
        <td>${esc(s.title)}${stepTag(s)}
          ${s.automation && s.detail ? `<div class="hint step-detail">${esc(s.detail)}</div>` : ""}
          ${s.links.length ? linkRow(s.links) : ""}${stepButtons(s)}</td>
        <td class="state"><span class="badge ${stateBadge[s.status] || "grey"}">${esc(s.status_label)}</span>
          ${s.due ? `<div class="hint">by ${esc(s.due)}</div>` : ""}</td>
      </tr>`).join("");
    return `<div class="card module">
      <h3><span>Launch test: ${esc(t.name)}</span>${whenBadge}</h3>
      <div class="big">${esc(t.headline || "No verdict yet.")}</div>
      ${t.next_step ? `<div class="hint">${esc(t.next_step)}</div>` : ""}
      <div class="hint">${dates}${t.stale ? ` <span class="badge warn">offline: last good answer${t.read_at ? ` from ${esc(t.read_at)}` : ""}</span>` : ""}</div>
      <table style="margin-top:8px">
        <thead><tr><th>Measure</th><th class="num">Now</th><th class="num">Needed</th><th class="num">Stop below</th></tr></thead>
        <tbody>${counts}</tbody>
      </table>
      ${steps ? `<table style="margin-top:12px">
        <thead><tr><th>Needs you · ${num(t.open)} open${t.automatic ? ` · ${num(t.automatic)} run by this PC` : ""}</th><th>State</th></tr></thead>
        <tbody>${steps}</tbody>
      </table>` : ""}
      ${t.links.length ? linkRow(t.links) : ""}
    </div>`;
  }).join("");
}

// TradeBot's own page (money, coins held, the plan, the checks, the history) is one HTML text that TradeBot made on

// sign-in or the local server. The one line added to it only tells this page how tall it is.
const TRADEBOT_PAGE_TELLS_HEIGHT = `<script>(() => {
  const tell = () => parent.postMessage({ tradebotPageHeight: document.body.offsetHeight }, "*");
  addEventListener("load", tell);
  addEventListener("resize", tell);
  if (window.ResizeObserver) new ResizeObserver(tell).observe(document.body);
  tell();
})();<\/script>`;
let tradebotPageShown = null;

window.addEventListener("message", (event) => {
  const frame = document.getElementById("tradebot-frame");
  const height = event.data && event.data.tradebotPageHeight;

  frame.style.height = Math.min(Math.max(Math.ceil(height), 240), 20000) + "px";
});

function patentHeadline(counts) {
  return counts.look || counts.maybe
    ? [counts.look ? `${num(counts.look)} worth an attorney look` : "", counts.maybe ? `${num(counts.maybe)} maybe` : ""].filter(Boolean).join(" · ")
    : "Nothing that looks like patent material";
}

function patentDeskHeadline(desk) {
  const c = desk.counts;
  return desk.total
    ? [
        c.ready ? `${num(c.ready)} ready to file` : "",
        c.filed ? `${num(c.filed)} filed` : "",
        c.strengthen ? `${num(c.strengthen)} strengthening` : "",
        c.disclosure ? `${num(c.disclosure)} disclosure${c.disclosure === 1 ? "" : "s"} to write` : "",
        c.ownership ? `${num(c.ownership)} waiting on ownership` : "",
        c.closed ? `${num(c.closed)} closed` : "",
      ].filter(Boolean).join(" · ")
    : "No candidates to follow";
}

  };

      <td data-label="Licence">${esc(r.licence ? r.licence.toUpperCase() : "none")}</td>

    ${rows ? `<div class="scroll" tabindex="0" role="region" aria-label="Projects that may hold patent material" style="margin-top:8px"><table class="candidates">

      <tbody>${rows}</tbody>
    </table></div>` : ""}
    ${others ? `<details><summary>All other projects (${num(p.others.length)})</summary>
      <div class="scroll" tabindex="0" role="region" aria-label="Projects with no patent route seen"><table>

// The page reloads its data every minute. Opened sections and half-typed fields in Overview survive that,
// and nothing is redrawn under a field that has the keyboard.
function keepingState(root, render) {
  const active = document.activeElement;
  if (active && active.tagName === "INPUT" && root.contains(active)) return;
  const open = [...root.querySelectorAll("details[data-keep][open]")].map((element) => element.dataset.keep);
  const typed = {};
  root.querySelectorAll("input[data-keep]").forEach((input) => { if (input.value) typed[input.dataset.keep] = input.value; });
  render();
  root.querySelectorAll("details[data-keep]").forEach((element) => { element.open = open.includes(element.dataset.keep); });
  root.querySelectorAll("input[data-keep]").forEach((input) => { if (typed[input.dataset.keep]) input.value = typed[input.dataset.keep]; });
}

// Readers: one project's own numbers (juw12/morrow social-data/metrics.csv) against the target it was given.
function meter(percent, label) {
  const value = Math.max(0, Math.min(100, Number(percent) || 0));
  return `<div class="meter" role="img" aria-label="${esc(label)}"><span style="width:${value}%"></span></div>`;
}

function readersCard(r) {
  const day = esc(niceDate(r.target_date).replace(/^[A-Za-z]{3} /, ""));
  const head = `<h3>${esc(r.name)} readers</h3>`;
  if (!r.available) {
    return `<div class="card module readers">${head}
      <div class="hint">No numbers yet: ${link(r.link, "the metrics file")} has not been read on this PC.</div>
    </div>`;
  }
  const trend = r.gained ? `${r.gained > 0 ? "+" : ""}${num(r.gained)} since ${esc(niceDate(r.since))}` : `flat since ${esc(niceDate(r.since))}`;
  const pace = r.reached
    ? `<span class="badge good">Target of ${num(r.target)} reached</span>`
    : `Target ${num(r.target)} by ${day}: ${num(r.needed)} to go in ${num(r.days_left)} day${r.days_left === 1 ? "" : "s"}, about ${num(r.per_day)} a day`;
  const read = r.stale
    ? `Cached numbers of ${esc(niceDate(r.date))}: the live file did not answer.`
    : r.route === "git"
      ? `Numbers of ${esc(niceDate(r.date))}, read through git: this network blocks the plain link.`
      : `Numbers of ${esc(niceDate(r.date))}, read ${esc(r.read_at)}.`;
  return `<div class="card module readers">${head}
    <div class="big">${num(r.subscribers)} subscriber${r.subscribers === 1 ? "" : "s"}</div>
    <div class="hint">${num(r.views)} typical view${r.views === 1 ? "" : "s"} a post &middot; ${num(r.per_100)} views per 100 readers &middot; ${trend}</div>
    ${meter(r.progress, `${r.progress}% of the ${num(r.target)} target`)}
    <div class="hint">${pace}</div>
    ${r.forecast ? `<div class="hint">${esc(r.forecast)}</div>` : ""}
    ${r.series.length > 2 ? lineChart(r.series, "") : ""}
    ${r.note ? `<div class="hint"><span class="badge warn">${num(r.age_days)} day${r.age_days === 1 ? "" : "s"} old</span> ${esc(r.note)}</div>` : ""}
    <div class="hint">${read} ${link(r.link, "Source")}</div>
  </div>`;
}

// Shorts: a channel's finished short videos, scheduled for X one at a time (shorts.py). Read from this PC's files.
function shortsCard(c) {
  const next = c.next;
  const big = !c.connected ? "X is not connected"
    : c.paused ? "Paused"
    : next ? `Next: ${esc(niceDate(next.due))}`
    : "No finished video is waiting";
  const nextLine = !c.connected ? "Finished videos are kept. They are scheduled once X is connected through Buffer."
    : c.paused ? `${esc(c.paused_why)} Nothing goes out until Resume.`
    : next ? `${esc(next.title)} <span class="badge ${next.state === "scheduled" ? "good" : "grey"}">${next.state === "scheduled" ? "Scheduled in Buffer" : "Goes to Buffer on the next run"}</span>`
    : c.sent ? "Every finished video has been posted." : "A video is scheduled within the hour after it is finished.";
  const supply = c.left
    ? `${num(c.left)} waiting${c.covered_until && !c.paused ? `, enough until ${esc(niceDate(c.covered_until))}` : ""}`
    : "none waiting";
  const low = c.left <= 2 && c.finished < c.target ? `<span class="badge warn">Running low</span> ` : "";
  return `<div class="card module shorts">
    <h3>${esc(c.name)} shorts on X <span class="hint">${esc(c.account)}</span></h3>
    <div class="big">${big}</div>
    <div class="hint">${nextLine}</div>
    ${meter(c.target ? (100 * c.finished) / c.target : 0, `${c.finished} of ${c.target} videos finished`)}
    <div class="hint">${low}${num(c.finished)} of ${num(c.target)} videos finished &middot; ${num(c.sent)} posted &middot; ${supply}</div>
    <div class="hint">One post ${esc(c.slots)}. Buffer publishes it at that time, also when this PC is off.</div>
    ${c.trouble ? `<div class="hint"><span class="badge warn">Not scheduled yet</span> ${esc(c.trouble)}</div>` : ""}
    ${c.failed.map((p) => `<div class="hint"><span class="badge bad">Refused twice</span> ${esc(p.title)}: ${esc(p.error)}</div>`).join("")}
    ${c.posts.map((p) => `<div class="hint">${esc(niceDate(p.sent_at))} &middot; ${link(p.link, p.title)}</div>`).join("")}
    ${c.not_connected.length ? `<div class="hint">Not connected: ${esc(c.not_connected.join(", "))}.</div>` : ""}
    <div class="actions">${actionButton(`shorts:${c.paused ? "resume" : "pause"}:${c.id}`, c.paused ? "Resume" : "Pause", !c.paused)}${actionButton("shorts_run_now", "Run now", true)}</div>
  </div>`;
}

      ${promote.installed ? kpi("Creator e-mails today", `${num(promote.sent_today)} / ${num(promote.cap)}`, `${num(promote.replies)} replies so far`) : ""}
    </div>
    ${todo.length ? `<div class="card">

// The scheduled auto-apply (modules/jobs/auto_apply.py): its last runs, what it skipped and why, and its queue.
// Absent where it has never run (hub.auto_apply_view returns nothing), so the card is simply not drawn there.
function autoApplyCard(a) {
  if (!a || !a.runs || !a.runs.length) return "";
  const STATE = { finished: ["Finished", "good"], crashed: ["Crashed", "bad"], running: ["Running now", "warn"], stopped: ["Stopped early", "bad"] };
  const RESULT = { applied: ["Applied", "good"], needs_you: ["Could not finish", "warn"], later: ["Will retry", "grey"], already: ["Already applied", "grey"], ready: ["Ready", "grey"] };
  const badge = ([text, tone]) => `<span class="badge ${tone}">${esc(text)}</span>`;
  const time = (stamp) => esc(String(stamp || "").split(" ")[1] || "");
  const last = a.runs[0];
  const digest = a.digest || {};
  const counts = digest.counts || {};
  const queued = digest.queued || [];
  const stuck = digest.needs_you || [];
  // Settled jobs of the Big tech mail, read from the queue file itself: also the ones applied outside a scheduled run.
  const SETTLED = { applied: ["Applied", "good"], already: ["Already applied", "grey"], skipped: ["Not applied", "grey"] };
  const settled = digest.done || [];
  const settledApplied = settled.filter((job) => job.status !== "skipped").length;
  const left = a.left || [];
  const results = a.results || [];
  const leftTotal = left.reduce((sum, group) => sum + group.jobs.length, 0);
  const tried = (run) => Object.values(run.counts || {}).reduce((sum, count) => sum + count, 0);
  return `<div class="card">
      <h3>Auto-apply</h3>
      <p class="hint">Runs by itself at 08:15, 13:15 and 19:15 and submits the jobs it can finish alone. What it could not finish is listed here with the reason.</p>
      <p><b>Last run</b> ${esc(niceDate(last.when))} ${badge(STATE[last.state] || [last.state, "grey"])}
        · submitted <b>${num(last.submitted || 0)}</b> · left for you <b>${num(leftTotal)}</b> · waiting in the queue <b>${num(counts.queued || 0)}</b></p>
      ${last.state === "crashed" ? `<p class="hint">It crashed at ${time(last.crashed)} before it finished. Jobs it had not reached stay queued for the next run.</p>` : ""}
      ${last.state === "stopped" ? `<p class="hint">It stopped without a closing line. Jobs it had not reached stay queued for the next run.</p>` : ""}
      ${(last.notes || []).map((note) => `<p class="hint">${esc(note)}</p>`).join("")}
      ${results.length ? `<div class="scroll" tabindex="0" role="region" aria-label="Scrollable table"><table>
        <thead><tr><th>Run</th><th>Job</th><th>Result</th></tr></thead><tbody>
        ${results.map((row) => `<tr><td>${esc(niceDate(row.when))}</td><td><b>${esc(row.job)}</b>${row.detail ? `<div class="hint" style="white-space:normal">${esc(row.detail)}</div>` : ""}</td><td>${badge(RESULT[row.kind] || [row.kind, "grey"])}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">No job was tried in the last runs.</div>`}
      ${settled.length ? `<details open><summary>From the Big tech mail: ${num(settledApplied)} applied, ${num(settled.length - settledApplied)} not applied</summary>
        <p class="hint">Every job of the mail that is settled, with the reason when it was not applied. Applications made outside a scheduled run are listed too. This list refreshes every minute.</p>
        <div class="scroll" tabindex="0" role="region" aria-label="Scrollable table"><table>
        <thead><tr><th>Date</th><th>Job</th><th>Result</th></tr></thead><tbody>
        ${settled.map((job) => `<tr><td>${esc(niceDate(job.date))}</td><td><b>${esc(job.company)}</b> ${link(job.url, job.title)}${job.detail ? `<div class="hint" style="white-space:normal">${esc(job.detail)}</div>` : ""}</td><td>${badge(SETTLED[job.status] || [job.status, "grey"])}</td></tr>`).join("")}
        </tbody></table></div></details>` : ""}
      ${stuck.length ? `<details open><summary>Needs you (${num(stuck.length)})</summary>
        ${stuck.map((job) => `<p><b>${esc(job.company)}</b> ${link(job.url, job.title)}<br><span class="hint">${esc(job.detail)}</span></p>`).join("")}</details>` : ""}
      ${left.length ? `<details><summary>Left for you (${num(leftTotal)})</summary>
        ${left.map((group) => `<p><b>${esc(group.reason)}</b> (${num(group.jobs.length)})<br><span class="hint">${group.jobs.map(esc).join(" · ")}</span></p>`).join("")}</details>` : ""}
      ${queued.length ? `<details><summary>Waiting in the queue (${num(counts.queued || 0)})</summary>
        <p class="hint">From the Big tech mail. A few per company go out in each run${counts.applied ? `; ${num(counts.applied)} already applied from this queue` : ""}.</p>
        ${queued.map((group) => `<p><b>${esc(group.company)}</b> (${num(group.titles.length)})<br><span class="hint">${group.titles.map(esc).join(" · ")}</span></p>`).join("")}</details>` : ""}
      ${a.runs.length > 1 ? `<details><summary>Earlier runs (${num(a.runs.length - 1)})</summary><div class="scroll" tabindex="0" role="region" aria-label="Scrollable table"><table>
        <thead><tr><th>Run</th><th>Result</th><th class="num">Tried</th><th class="num">Submitted</th></tr></thead><tbody>
        ${a.runs.slice(1).map((run) => `<tr><td>${esc(niceDate(run.when))}</td><td>${badge(STATE[run.state] || [run.state, "grey"])}</td><td class="num">${num(tried(run))}</td><td class="num">${num(run.submitted || 0)}</td></tr>`).join("")}
        </tbody></table></div></details>` : ""}
    </div>`;
}

// What a mailbox holds that only I can deal with (hub.inbox_section reads inbox_private.json). Not drawn where that
// file is missing. Every word comes from mail, so every word goes through esc(); links are built by the hub.
// A mail with a key can be answered here: the buttons are hub.inbox_action names, the answer is kept on the PC
// (inbox_answers.json) and To do follows it. No mail is opened, answered or changed by an answer.
function inboxCard(inbox) {
  if (!inbox || !inbox.installed) return "";
  const groups = inbox.groups || [];
  const facts = [
    inbox.read !== null && inbox.read !== undefined ? `${num(inbox.read)} mails gone through` : "",
    `${num(inbox.kept_unread || 0)} left unread for you`,
    inbox.still_unread ? `${num(inbox.still_unread)} not looked at yet` : "",
    inbox.checked_at ? `checked ${esc(niceDate(inbox.checked_at))}` : "",
  ].filter(Boolean).join(" · ");
  const settled = (item) => Boolean(item.key) && !item.open;
  const progress = inbox.open || inbox.answered
    ? `<p><b>${num(inbox.open || 0)}</b> waiting for your answer · <b>${num(inbox.answered || 0)}</b> answered</p>` : "";
  const about = (item) => `${[item.sender, item.date ? niceDate(item.date) : ""].filter(Boolean).map(esc).join(" · ")}${
    item.detail ? `${item.sender || item.date ? " · " : ""}${esc(item.detail)}` : ""}`;
  const undo = (item) => (item.answer ? `<button class="btn ghost" data-action="${esc(`inbox:reopen:${item.key}`)}" data-now>Undo</button>` : "");
  const answeredMail = (item) => `<div class="todo answered">
      <div class="text">
        <h4>${esc(item.title)}</h4> <span class="badge ${["mine", "done", "secured"].includes(item.answer.choice) ? "good" : "grey"}">${esc(item.answer.label)}</span>
        <div class="hint">${item.answer.at ? `answered ${esc(niceDate(item.answer.at))}` : "answered"}${item.note ? ` · your note: ${esc(item.note)}` : ""}</div>
      </div>
      <div class="actions">${undo(item).replace("btn ghost", "btn ghost small")}</div>
    </div>`;
  // Quiet buttons: no answer is suggested. Only "Secured", the step that ends a "Not me" alarm, is filled.
  const choices = (item) => (item.choices || []).map((choice) =>
    `<button class="btn${item.answer ? "" : " ghost"}" data-action="${esc(choice.name)}" data-now>${esc(choice.label)}</button>`).join("");
  const noteField = (item) => `${item.note ? `<div class="hint">Your note: ${esc(item.note)}</div>` : ""}
        <details data-keep="${esc(`inbox-note:${item.key}`)}"><summary>${item.note ? "Change the note" : "Add a note"}</summary>
          <div class="note-form">
            <input type="text" maxlength="300" value="${esc(item.note)}" placeholder="What should happen with this mail" aria-label="${esc(`Note about ${item.title}`)}" data-keep="${esc(`inbox-note-text:${item.key}`)}">
            <button class="btn ghost" data-inbox-note="${esc(item.key)}" data-now>Save note</button>
          </div>
        </details>`;
  const openMail = (item, urgent) => `<div class="todo mail${urgent || (item.answer && item.open) ? " p1" : ""}">
      <div class="text">
        <h4>${esc(item.title)}</h4>${item.unread ? ` <span class="badge warn">unread</span>` : ""}${
          item.answer ? ` <span class="badge bad">${esc(item.answer.label)}: change that password</span>` : ""}
        <div class="hint">${about(item)}</div>
        ${item.key ? noteField(item) : ""}
      </div>
      <div class="actions">${choices(item)}${undo(item)}${item.url ? link(item.url, "Open in Gmail") : ""}</div>
    </div>`;
  const heading = (group) => {
    const canAnswer = group.items.filter((item) => item.key);
    const open = canAnswer.filter((item) => item.open).length;
    const allAnswered = canAnswer.length === group.items.length && !open;
    const word = allAnswered ? "answered" : group.priority === 1 ? "needs you" : group.priority === 2 ? "worth knowing" : "for the record";
    const count = !canAnswer.length || allAnswered ? num(group.items.length) : `${num(open)} of ${num(group.items.length)} open`;
    // Mails that are only to know can be ticked off together; a mail that asks something is answered one by one.
    const toKnow = canAnswer.filter((item) => item.open && item.ask === "know" && !item.answer).length;
    const seenAll = toKnow > 1 && group.seen_all
      ? ` <button class="btn ghost small" data-action="${esc(group.seen_all)}" data-now>Mark ${toKnow === open ? "all" : "the"} ${num(toKnow)} seen</button>` : "";
    return `<h4 class="mail-group">${esc(group.title)} <span class="badge ${allAnswered ? "good" : group.priority === 1 ? "bad" : group.priority === 2 ? "warn" : "grey"}">${word} · ${count}</span>${seenAll}</h4>`;
  };
  // Inside a group: what still waits for me first, what I answered after it, each in the order of the file.
  const rows = (group) => [...group.items.filter((item) => !settled(item)).map((item) => openMail(item, group.priority === 1)),
    ...group.items.filter(settled).map(answeredMail)].join("");
  return `
    <div class="card" id="inbox-card">
      <h3>Inbox${inbox.account ? ` · ${esc(inbox.account)}` : ""}</h3>
      <p class="hint">What needs you from this mailbox. Everything else was read and needs nothing. ${facts}</p>
      ${inbox.note ? `<p class="hint">${esc(inbox.note)}</p>` : ""}
      ${progress}
      ${inbox.open || inbox.answered ? `<p class="hint">Answer a mail here or in To do: the answer is kept on this PC and both pages follow it. An answer sends nothing and changes no mail.</p>` : ""}
      ${groups.length ? groups.map((group) => `
        ${heading(group)}
        ${group.note ? `<p class="hint" style="margin:0 0 4px">${esc(group.note)}</p>` : ""}
        ${rows(group)}`).join("")
        : `<div class="empty">Nothing in this mailbox needs you.</div>`}
    </div>`;
}

      ${e.leads.map((l) => `<tr><td class="num">${num(l.fit)}</td><td><b>${esc(l.company)}</b><div class="hint">${esc(l.title)}</div></td><td>${esc(l.region)}</td><td class="hint">${esc(l.salary || "–")}</td><td>${link(l.url, "Open")}</td></tr>`).join("")}
