name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pypdf lets the selftest type values into a small PDF form, as the patent desk does with form PTO/SB/16.
      - run: pip install requests openpyxl pillow pypdf
      - run: python selftest.py
        env:
          CI: "1"
      # No private repository name in the files or in any commit. The names come from a secret and are never printed.
      # A pull request from a fork has no secret and passes; a push to main must have the list.
      - name: Leak check
        run: python leakcheck.py --history ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--require' || '' }}
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}

  # ReachPilot runs on Windows and on a Mac, so the same checks run on both.
  selftest-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl pillow pypdf
      - run: python selftest.py
        env:
          CI: "1"
          PYTHONIOENCODING: utf-8
